<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta — PsiCerca</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script></head><body><header><div class="container nav"><a class="logo" href="index.html">Psi<span>Cerca</span></a><a href="login.html" class="btn secondary">Iniciar sesión</a></div></header><main class="form-wrap"><div class="form-card"><span class="eyebrow">Primer paso</span><h1>Crear cuenta profesional</h1><p class="small">Tu cuenta te permitirá acceder al panel y crear tu perfil público.</p><form id="registerForm"><div class="field"><label>Nombre y apellido</label><input id="fullName" required autocomplete="name"></div><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><div class="small">Mínimo 8 caracteres.</div></div><div class="field"><label>Matrícula</label><input id="license" required></div><div class="field"><label>Jurisdicción</label><select id="jurisdiction" required><option value="">Seleccioná</option><option>Ciudad de Buenos Aires</option><option>Provincia de Buenos Aires</option><option>Otra</option></select></div><label class="check"><input id="terms" type="checkbox" required><span>Acepto crear una cuenta profesional y que mis datos de perfil puedan ser publicados si activo esa opción.</span></label><button class="btn primary full" type="submit">Crear cuenta</button><div id="msg" class="message"></div></form></div></main><script>document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='Creando…';try{const sb=requireSupabase();const {data,error}=await sb.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:fullName.value,license:license.value,jurisdiction:jurisdiction.value}}});if(error)throw error;if(data.session){location.href='dashboard.html'}else{showMessage('msg','Cuenta creada. Revisá tu email para confirmar la cuenta y luego iniciá sesión.')}}catch(err){showMessage('msg',err.message||'No se pudo crear la cuenta.',true)}finally{b.disabled=false;b.textContent='Crear cuenta'}})</script></body></html>
