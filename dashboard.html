<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel profesional — PsiCerca</title><link rel="stylesheet" href="css/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script></head><body><header><div class="container nav"><a class="logo" href="index.html">Psi<span>Cerca</span></a><nav class="navlinks"><a href="profesionales.html">Directorio</a><button class="btn secondary" onclick="logout()">Cerrar sesión</button></nav></div></header><main class="dashboard"><div class="container"><div class="dash-head"><div><span class="eyebrow">Área profesional</span><h1>Mi panel</h1><p id="welcome" class="small">Cargando…</p></div><a class="btn primary" href="profesionales.html">Ver directorio</a></div><div class="dash-grid"><aside class="side"><a class="active" href="#perfil">Mi perfil</a><a href="#perfil">Información profesional</a><a href="#proximamente">Agenda <small>(próximamente)</small></a><a href="#proximamente">Estadísticas <small>(próximamente)</small></a></aside><section class="panel" id="perfil"><h2>Mi perfil profesional</h2><p class="small">Completá tu información. Solo se mostrará públicamente cuando actives “Publicar perfil”.</p><form id="profileForm" class="profile-form"><div class="field"><label>Nombre profesional</label><input id="display_name" required></div><div class="field"><label>Jurisdicción</label><select id="jurisdiction"><option>Ciudad de Buenos Aires</option><option>Provincia de Buenos Aires</option><option>Otra</option></select></div><div class="field"><label>Matrícula</label><input id="license" required></div><div class="field"><label>Zona / localidad</label><input id="zone" placeholder="Ej. Lanús"></div><div class="field"><label>Modalidad</label><select id="modality"><option>Presencial y online</option><option>Solo online</option><option>Solo presencial</option></select></div><div class="field"><label>Orientación</label><input id="orientation" placeholder="Ej. Psicoanálisis, TCC, sistémica"></div><div class="field"><label>Población</label><input id="population" placeholder="Ej. Adultos, adolescentes"></div><div class="field"><label>WhatsApp público (opcional)</label><input id="whatsapp" type="tel"></div><div class="field span-2"><label>Presentación</label><textarea id="bio" maxlength="1000" placeholder="Contá brevemente sobre tu práctica profesional."></textarea></div><div class="field span-2"><label class="check"><input id="is_public" type="checkbox"><span><strong>Publicar perfil</strong><br>Al activarlo, tu perfil podrá aparecer en el directorio público.</span></label></div><div class="span-2"><button class="btn primary" type="submit">Guardar cambios</button><div id="msg" class="message"></div></div></form></section></div></div></main><script src="js/dashboard.js"></script></body></html>
