<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Perfil profesional — PsiCerca</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
</head>

<body>

  <header>
    <div class="container nav">

      <a class="logo" href="index.html">
        Psi<span>Cerca</span>
      </a>

      <a href="profesionales.html" class="btn secondary">
        ← Volver al directorio
      </a>

    </div>
  </header>

  <main class="form-wrap" style="max-width:760px">

    <div id="profile" class="panel">

      <div class="empty">
        Cargando perfil…
      </div>

    </div>

  </main>

  <footer class="footer">

    <div class="container">
      PsiCerca · Plataforma tecnológica · 2026
    </div>

  </footer>


  <script>

    (async function () {

      const box = document.getElementById('profile');

      const id =
        new URLSearchParams(window.location.search).get('id');

      if (!id) {

        box.innerHTML = `
          <div class="empty">
            Perfil no encontrado.
          </div>
        `;

        return;
      }

      try {

        const sb = requireSupabase();

        const { data: p, error } = await sb
          .from('profiles')
          .select(`
            display_name,
            license,
            jurisdiction,
            zone,
            modality,
            orientation,
            population,
            bio,
            whatsapp,
            photo_url
          `)
          .eq('id', id)
          .eq('is_public', true)
          .single();

        if (error) {
          throw error;
        }

        if (!p) {
          throw new Error('Perfil no encontrado');
        }

        const initials =
          (p.display_name || 'PS')
            .split(' ')
            .filter(Boolean)
            .map(x => x[0])
            .join('')
            .slice(0, 2)
            .toUpperCase();

        const avatar = p.photo_url
          ? `
            <div
              class="avatar"
              style="width:72px;height:72px;overflow:hidden;"
            >
              <img
                src="${escapeHTML(p.photo_url)}"
                alt="Foto de ${escapeHTML(p.display_name || 'profesional')}"
                style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;"
              >
            </div>
          `
          : `
            <div
              class="avatar"
              style="width:72px;height:72px"
            >
              ${escapeHTML(initials)}
            </div>
          `;

        const whatsapp =
          (p.whatsapp || '').replace(/\D/g, '');

        box.innerHTML = `

          <div class="pro-top">

            ${avatar}

            <div>

              <span class="eyebrow">
                Perfil profesional
              </span>

              <h1>
                ${escapeHTML(p.display_name || 'Profesional')}
              </h1>

           <div class="small">
  Matrícula:
  <strong>${escapeHTML(p.license || '—')}</strong>
  ·
  ${escapeHTML(p.jurisdiction || '—')}
</div>

${
  p.license
    ? `
      <a
        href="https://www.argentina.gob.ar/salud/buscador-nacional-de-profesionales-de-la-salud"
        target="_blank"
        rel="noopener noreferrer"
        class="btn secondary"
        style="margin-top:12px;font-size:13px;"
      >
        🔎 Consultar matrícula en registro oficial
      </a>
    `
    : ''
}
          </div>


          <div
            class="chips"
            style="margin-top:25px"
          >

            ${
              [
                p.orientation,
                p.population,
                p.modality,
                p.zone
              ]
              .filter(Boolean)
              .map(x =>
                `<span class="chip">
                  ${escapeHTML(x)}
                </span>`
              )
              .join('')
            }

          </div>


          <h2>
            Sobre mi práctica
          </h2>

          <p>
            ${
              escapeHTML(
                p.bio ||
                'El profesional todavía no agregó una presentación.'
              )
            }
          </p>


          ${
            whatsapp
              ? `
                <a
                  class="btn primary"
                  target="_blank"
                  rel="noopener"
                  href="https://wa.me/${whatsapp}"
                >
                  Contactar por WhatsApp
                </a>
              `
              : ''
          }


        <p
  class="small"
  style="margin-top:20px"
>
  La información de matrícula es declarada por el profesional.
  PsiCerca recomienda verificarla en el
  <a
    href="https://www.argentina.gob.ar/salud/buscador-nacional-de-profesionales-de-la-salud"
    target="_blank"
    rel="noopener noreferrer"
    style="color:var(--accent);font-weight:700;"
  >
    registro oficial del Ministerio de Salud
  </a>.
</p>

<p
  class="small"
  style="margin-top:10px"
>
  PsiCerca facilita el contacto y no determina
  qué profesional es clínicamente adecuado
  para una persona.
</p>

        `;

      } catch (error) {

        console.error(
          'Error cargando perfil:',
          error
        );

        box.innerHTML = `
          <div class="empty">
            Este perfil no está disponible o no es público.
          </div>
        `;

      }

    })();

  </script>

</body>

</html>
