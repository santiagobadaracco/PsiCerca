<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Perfil profesional — PsiCerca</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>

  <style>

    /* =====================================================
       PERFIL PROFESIONAL
       ===================================================== */

    .profile-header {
      display:flex;
      align-items:center;
      gap:20px;
      margin-bottom:30px;
    }

    .profile-avatar {
      width:88px;
      height:88px;
      min-width:88px;
      border-radius:50%;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--soft);
      font-weight:800;
      font-size:24px;
    }

    .profile-avatar img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }


    /* =====================================================
       AGENDA DIGITAL
       ===================================================== */

    .agenda-card {
      margin-top:34px;
      padding:26px;
      border:1px solid var(--line);
      border-radius:20px;
      background:#fff;
      box-shadow:0 8px 28px rgba(0,0,0,.045);
    }

    .agenda-header {
      display:flex;
      align-items:flex-start;
      gap:14px;
      margin-bottom:22px;
    }

    .agenda-icon {
      width:46px;
      height:46px;
      min-width:46px;
      border-radius:14px;
      background:var(--soft);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
    }

    .agenda-title {
      margin:2px 0 5px;
      font-size:25px;
      line-height:1.15;
    }

    .agenda-subtitle {
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.55;
    }

    .agenda-controls {
      display:flex;
      gap:12px;
      align-items:end;
      flex-wrap:wrap;
      margin-bottom:22px;
    }

    .agenda-control {
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .agenda-control label {
      font-size:13px;
      font-weight:700;
    }

    .agenda-control input,
    .agenda-control select {
      min-height:44px;
      box-sizing:border-box;
    }

    .agenda-slots {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
    }

    .agenda-slot {
      width:100%;
      min-height:58px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      cursor:pointer;
      font:inherit;
      font-weight:700;
      transition:.15s ease;
      padding:10px;
    }

    .agenda-slot:hover {
      transform:translateY(-1px);
      border-color:var(--accent);
    }

    .agenda-slot-time {
      display:block;
      font-size:16px;
      font-weight:800;
    }

    .agenda-slot small {
      display:block;
      margin-top:3px;
      font-size:11px;
      font-weight:500;
      color:var(--muted);
    }

    .agenda-message {
      padding:16px;
      border-radius:14px;
      background:var(--soft);
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    .agenda-confirm {
      margin-top:20px;
      padding:20px;
      border-radius:16px;
      background:var(--soft);
    }

    .agenda-confirm-title {
      font-weight:800;
      margin-bottom:6px;
    }

    .agenda-confirm-details {
      margin:0 0 16px;
      font-size:14px;
      line-height:1.5;
    }

    .agenda-confirm-actions {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .agenda-status {
      margin-top:14px;
      font-size:13px;
      font-weight:600;
    }


    /* =====================================================
       CONSULTA
       ===================================================== */

    .inquiry-card {
      margin-top:34px;
      padding:26px;
      border:1px solid var(--line);
      border-radius:20px;
      background:#fff;
      box-shadow:0 8px 28px rgba(0,0,0,.045);
    }

    .inquiry-header {
      display:flex;
      align-items:flex-start;
      gap:14px;
      margin-bottom:24px;
    }

    .inquiry-icon {
      width:46px;
      height:46px;
      min-width:46px;
      border-radius:14px;
      background:var(--soft);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
    }

    .inquiry-title {
      margin:2px 0 5px;
      font-size:25px;
      line-height:1.15;
    }

    .inquiry-subtitle {
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.55;
    }

    .inquiry-fields {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:16px;
    }

    .inquiry-field {
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .inquiry-field.full {
      grid-column:1 / -1;
    }

    .inquiry-label {
      font-size:13px;
      font-weight:700;
    }

    .inquiry-field input,
    .inquiry-field select,
    .inquiry-field textarea {
      width:100%;
      box-sizing:border-box;
    }

    .inquiry-hint {
      font-size:11px;
      color:var(--muted);
      line-height:1.4;
    }

    .inquiry-textarea-wrap {
      position:relative;
    }

    .inquiry-textarea-wrap textarea {
      padding-bottom:34px;
      resize:vertical;
      min-height:150px;
    }

    .character-counter {
      position:absolute;
      right:12px;
      bottom:10px;
      font-size:12px;
      color:var(--muted);
      pointer-events:none;
    }

    .privacy-box {
      display:flex;
      gap:12px;
      align-items:flex-start;
      margin-top:18px;
      padding:14px 16px;
      border-radius:14px;
      background:var(--soft);
    }

    .privacy-icon {
      font-size:17px;
      line-height:1.3;
    }

    .privacy-text {
      margin:0;
      font-size:12px;
      line-height:1.55;
      color:var(--muted);
    }

    .inquiry-actions {
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
      margin-top:20px;
    }

    .inquiry-submit {
      min-width:160px;
      justify-content:center;
    }

    .inquiry-submit:disabled {
      opacity:.65;
      cursor:not-allowed;
    }

    .inquiry-status {
      font-size:13px;
      font-weight:600;
    }


    /* =====================================================
       CONTACTO
       ===================================================== */

    .contact-note {
      margin-top:16px;
      padding:14px 16px;
      border-radius:14px;
      background:var(--soft);
      font-size:12px;
      line-height:1.55;
      color:var(--muted);
    }

    .whatsapp-area {
      margin-top:8px;
      padding-top:24px;
      border-top:1px solid var(--line);
    }

    .whatsapp-box {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:18px;
      border-radius:16px;
      background:var(--soft);
    }

    .whatsapp-title {
      font-weight:700;
      margin-bottom:4px;
    }

    .whatsapp-description {
      margin:0;
    }

    .access-box {
      background:var(--soft);
      border-radius:16px;
      padding:18px;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width:650px) {

      .profile-header {
        align-items:flex-start;
        gap:14px;
      }

      .profile-avatar {
        width:70px;
        height:70px;
        min-width:70px;
        font-size:20px;
      }

      .agenda-card,
      .inquiry-card {
        padding:20px;
        border-radius:18px;
      }

      .agenda-slots {
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      .agenda-controls {
        flex-direction:column;
        align-items:stretch;
      }

      .agenda-control,
      .agenda-control input,
      .agenda-control select {
        width:100%;
      }

      .inquiry-fields {
        grid-template-columns:1fr;
      }

      .inquiry-field.full {
        grid-column:auto;
      }

      .inquiry-actions {
        align-items:stretch;
        flex-direction:column;
      }

      .inquiry-submit {
        width:100%;
      }

      .whatsapp-box {
        align-items:stretch;
        flex-direction:column;
      }

      .whatsapp-box .btn {
        width:100%;
        justify-content:center;
      }

    }

  </style>

</head>


<body>

<header>

  <div class="container nav">

    <a
      class="logo"
      href="index.html"
    >
      Psi<span>Cerca</span>
    </a>

    <a
      href="profesionales.html"
      class="btn secondary"
    >
      ← Volver al directorio
    </a>

  </div>

</header>


<main
  class="form-wrap"
  style="max-width:760px"
>

  <div
    id="profile"
    class="panel"
  >

    <div class="empty">
      Cargando perfil…
    </div>

  </div>

</main>


<footer class="footer">

  <div class="container">
    PsiCerca · Plataforma tecnológica · 2026
  </div>

</footer>


<script>

(async function () {

  const box =
    document.getElementById('profile');

  const id =
    new URLSearchParams(
      window.location.search
    ).get('id');


  if (!id) {

    box.innerHTML = `
      <div class="empty">
        Perfil no encontrado.
      </div>
    `;

    return;

  }


  try {

    const sb =
      requireSupabase();


    /* =====================================================
       PERFIL PÚBLICO
       ===================================================== */

    const {
      data: p,
      error
    } = await sb
      .from('profiles')
      .select(`
        id,
        display_name,
        license,
        jurisdiction,
        zone,
        modality,
        orientation,
        population,
        bio,
        photo_url
      `)
      .eq('id', id)
      .eq('is_public', true)
      .single();


    if (error) {
      throw error;
    }


    if (!p) {
      throw new Error('Perfil no encontrado');
    }


    /* =====================================================
       INICIALES
       ===================================================== */

    const initials =
      (p.display_name || 'PS')
        .split(' ')
        .filter(Boolean)
        .map(x => x[0])
        .join('')
        .slice(0,2)
        .toUpperCase();


    /* =====================================================
       FOTO / AVATAR
       ===================================================== */

    const avatar =
      p.photo_url
        ? `
          <div class="profile-avatar">

            <img
              src="${escapeHTML(p.photo_url)}"
              alt="Foto de ${escapeHTML(
                p.display_name || 'profesional'
              )}"
            >

          </div>
        `
        : `
          <div class="profile-avatar">
            ${escapeHTML(initials)}
          </div>
        `;


    /* =====================================================
       CHIPS
       ===================================================== */

    const chips = [
      p.orientation,
      p.population,
      p.modality,
      p.zone
    ]
      .filter(Boolean)
      .map(x => `
        <span class="chip">
          ${escapeHTML(x)}
        </span>
      `)
      .join('');


    /* =====================================================
       PERFIL
       ===================================================== */

    box.innerHTML = `

      <div class="profile-header">

        ${avatar}

        <div style="min-width:0;">

          <span class="eyebrow">
            Perfil profesional
          </span>

          <h1
            style="
              margin:4px 0 8px;
              font-size:clamp(32px,5vw,48px);
            "
          >
            ${escapeHTML(
              p.display_name || 'Profesional'
            )}
          </h1>

          <div class="small">

            Matrícula:

            <strong>
              ${escapeHTML(
                p.license || '—'
              )}
            </strong>

            ·

            ${escapeHTML(
              p.jurisdiction || '—'
            )}

          </div>

        </div>

      </div>


      ${
        p.license
          ? `
            <div
              style="
                background:var(--soft);
                border-radius:16px;
                padding:16px 18px;
                margin-bottom:28px;
              "
            >

              <div
                style="
                  font-weight:700;
                  margin-bottom:5px;
                "
              >
                🔎 ¿Querés comprobar la matrícula?
              </div>

              <p
                class="small"
                style="margin:0 0 12px;"
              >
                Podés consultar esta matrícula
                directamente en el registro oficial
                del Ministerio de Salud.
              </p>

              <a
                href="https://www.argentina.gob.ar/salud/buscador-nacional-de-profesionales-de-la-salud"
                target="_blank"
                rel="noopener noreferrer"
                class="btn secondary"
                style="font-size:13px;"
              >
                Consultar matrícula en registro oficial
              </a>

            </div>
          `
          : ''
      }


      ${
        chips
          ? `
            <div
              class="chips"
              style="margin:0 0 32px;"
            >
              ${chips}
            </div>
          `
          : ''
      }


      <section>

        <h2>
          Sobre mi práctica
        </h2>

        <p
          style="
            white-space:pre-line;
            margin-bottom:28px;
          "
        >
          ${
            escapeHTML(
              p.bio ||
              'El profesional todavía no agregó una presentación.'
            )
          }
        </p>

      </section>


      <div id="agendaArea"></div>


      <div
        id="contactArea"
        class="whatsapp-area"
      >

        <div class="small">
          Verificando acceso al contacto…
        </div>

      </div>


      <div id="inquiryArea"></div>


      <div
        style="
          margin-top:32px;
          padding-top:20px;
          border-top:1px solid var(--line);
        "
      >

        <p
          class="small"
          style="margin:0 0 10px;"
        >

          La información de matrícula es declarada
          por el profesional. PsiCerca recomienda
          verificarla en el

          <a
            href="https://www.argentina.gob.ar/salud/buscador-nacional-de-profesionales-de-la-salud"
            target="_blank"
            rel="noopener noreferrer"
            style="
              color:var(--accent);
              font-weight:700;
            "
          >
            registro oficial del Ministerio de Salud
          </a>.

        </p>

        <p
          class="small"
          style="margin:0;"
        >
          PsiCerca facilita el contacto y no determina
          qué profesional es clínicamente adecuado
          para una persona.
        </p>

      </div>

    `;


    const contactArea =
      document.getElementById('contactArea');

    const inquiryArea =
      document.getElementById('inquiryArea');

    const agendaArea =
      document.getElementById('agendaArea');


    /* =====================================================
       USUARIO ACTUAL
       ===================================================== */

    const {
      data: {
        user
      }
    } =
      await sb.auth.getUser();


    /* =====================================================
       AGENDA
       ===================================================== */

    await renderAgenda(
      sb,
      id,
      p,
      user,
      agendaArea
    );


    /* =====================================================
       SIN SESIÓN
       ===================================================== */

    if (!user) {

      contactArea.innerHTML = `

        <div class="access-box">

          <div
            style="
              font-weight:700;
              margin-bottom:6px;
            "
          >
            🔐 ¿Querés contactar a este profesional?
          </div>

          <p
            class="small"
            style="margin:0 0 15px;"
          >
            Creá una cuenta gratuita para
            poder contactar a profesionales
            a través de PsiCerca.
          </p>

          <div
            style="
              display:flex;
              gap:10px;
              flex-wrap:wrap;
            "
          >

            <a
              href="registro-paciente.html"
              class="btn primary"
            >
              Crear cuenta
            </a>

            <a
              href="login.html"
              class="btn secondary"
            >
              Iniciar sesión
            </a>

          </div>

        </div>

      `;


      inquiryArea.innerHTML = `

        <div
          class="inquiry-card"
          style="
            background:var(--soft);
            box-shadow:none;
          "
        >

          <div class="inquiry-header">

            <div class="inquiry-icon">
              💬
            </div>

            <div>

              <span class="eyebrow">
                Contacto
              </span>

              <h2 class="inquiry-title">
                Enviar consulta
              </h2>

              <p class="inquiry-subtitle">
                Iniciá sesión o creá una cuenta de paciente
                para enviar una consulta.
              </p>

            </div>

          </div>

        </div>

      `;

      return;

    }


    /* =====================================================
       ROL
       ===================================================== */

    const role =
      user.user_metadata?.role;


    /* =====================================================
       PACIENTE
       ===================================================== */

    if (role === 'patient') {

      const {
        data: contacts,
        error: contactError
      } =
        await sb.rpc(
          'get_professional_contact',
          {
            target_profile_id:id
          }
        );


      if (
        contactError ||
        !contacts ||
        !contacts.length ||
        !contacts[0].whatsapp
      ) {

        contactArea.innerHTML = `

          <div class="access-box">

            <div class="small">
              Este profesional todavía no
              agregó un medio de contacto.
            </div>

          </div>

        `;

      } else {

        const whatsapp =
          String(
            contacts[0].whatsapp
          ).replace(/\D/g,'');


        if (whatsapp) {

          contactArea.innerHTML = `

            <div class="whatsapp-box">

              <div>

                <div class="whatsapp-title">
                  ¿Preferís un contacto directo?
                </div>

                <p class="small whatsapp-description">
                  También podés comunicarte con este
                  profesional por WhatsApp.
                </p>

              </div>

              <a
                class="btn primary"
                target="_blank"
                rel="noopener noreferrer"
                href="https://wa.me/${escapeHTML(whatsapp)}"
              >
                Contactar por WhatsApp
              </a>

            </div>

          `;

        }

      }


      /* ===================================================
         FORMULARIO
         =================================================== */

      inquiryArea.innerHTML = `

        <section class="inquiry-card">

          <div class="inquiry-header">

            <div class="inquiry-icon">
              💬
            </div>

            <div>

              <span class="eyebrow">
                Contacto
              </span>

              <h2 class="inquiry-title">
                Enviar consulta
              </h2>

              <p class="inquiry-subtitle">
                Completá tus datos y contale brevemente
                a este profesional qué estás buscando.
                Luego podrá contactarte directamente.
              </p>

            </div>

          </div>


          <form id="inquiryForm">

            <div class="inquiry-fields">

              <label class="inquiry-field">

                <span class="inquiry-label">
                  Nombre y apellido *
                </span>

                <input
                  id="inquiryName"
                  type="text"
                  required
                  maxlength="100"
                  placeholder="Tu nombre y apellido"
                >

              </label>


              <label class="inquiry-field">

                <span class="inquiry-label">
                  Edad
                </span>

                <input
                  id="inquiryAge"
                  type="number"
                  min="1"
                  max="120"
                  placeholder="Edad"
                >

              </label>


              <label class="inquiry-field">

                <span class="inquiry-label">
                  WhatsApp *
                </span>

                <input
                  id="inquiryWhatsapp"
                  type="tel"
                  required
                  maxlength="30"
                  placeholder="Ej.: 11 1234-5678"
                >

                <span class="inquiry-hint">
                  El profesional utilizará este número
                  para contactarte.
                </span>

              </label>


              <label class="inquiry-field">

                <span class="inquiry-label">
                  Email
                </span>

                <input
                  id="inquiryEmail"
                  type="email"
                  maxlength="150"
                  placeholder="tuemail@ejemplo.com"
                >

                <span class="inquiry-hint">
                  Opcional.
                </span>

              </label>


              <label class="inquiry-field">

                <span class="inquiry-label">
                  Modalidad
                </span>

                <select id="inquiryModality">

                  <option value="">
                    Seleccionar
                  </option>

                  <option value="Presencial">
                    Presencial
                  </option>

                  <option value="Virtual">
                    Virtual
                  </option>

                  <option value="Indistinta">
                    Indistinta
                  </option>

                </select>

              </label>


              <label class="inquiry-field">

                <span class="inquiry-label">
                  Zona
                </span>

                <input
                  id="inquiryZone"
                  type="text"
                  maxlength="100"
                  placeholder="Ej.: Avellaneda"
                >

              </label>


              <label class="inquiry-field full">

                <span class="inquiry-label">
                  Disponibilidad
                </span>

                <input
                  id="inquiryAvailability"
                  type="text"
                  maxlength="150"
                  placeholder="Ej.: lunes y miércoles por la tarde"
                >

              </label>


              <label class="inquiry-field full">

                <span class="inquiry-label">
                  Motivo general
                </span>

                <select id="inquiryReason">

                  <option value="">
                    Seleccionar
                  </option>

                  <option value="Inicio de proceso">
                    Inicio de proceso
                  </option>

                  <option value="Orientación">
                    Orientación
                  </option>

                  <option value="Consulta personal">
                    Consulta personal
                  </option>

                  <option value="Consulta de pareja">
                    Consulta de pareja
                  </option>

                  <option value="Consulta familiar">
                    Consulta familiar
                  </option>

                  <option value="Otro">
                    Otro
                  </option>

                </select>

              </label>


              <label class="inquiry-field full">

                <span class="inquiry-label">
                  Mensaje *
                </span>

                <div class="inquiry-textarea-wrap">

                  <textarea
                    id="inquiryMessage"
                    required
                    maxlength="1000"
                    rows="6"
                    placeholder="Contale brevemente qué estás buscando y qué necesitás."
                  ></textarea>

                  <span
                    id="characterCounter"
                    class="character-counter"
                  >
                    0 / 1000
                  </span>

                </div>

              </label>

            </div>


            <div class="privacy-box">

              <div class="privacy-icon">
                🔒
              </div>

              <p class="privacy-text">
                Por privacidad, evitá incluir diagnósticos,
                antecedentes clínicos detallados, medicación
                o historias clínicas.
              </p>

            </div>


            <div class="contact-note">

              <strong>¿Qué pasa después?</strong><br>

              Tu consulta será recibida por el profesional.
              Si considera que puede responder a tu búsqueda,
              podrá contactarte directamente.

            </div>


            <div class="inquiry-actions">

              <button
                type="submit"
                class="btn primary inquiry-submit"
                id="sendInquiryButton"
              >
                Enviar consulta
              </button>

              <span
                id="inquiryMessageStatus"
                class="inquiry-status"
              ></span>

            </div>

          </form>

        </section>

      `;


      const inquiryForm =
        document.getElementById('inquiryForm');

      const sendButton =
        document.getElementById('sendInquiryButton');

      const inquiryStatus =
        document.getElementById('inquiryMessageStatus');

      const messageField =
        document.getElementById('inquiryMessage');

      const characterCounter =
        document.getElementById('characterCounter');


      function updateCharacterCounter() {

        characterCounter.textContent =
          `${messageField.value.length} / 1000`;

      }


      messageField.addEventListener(
        'input',
        updateCharacterCounter
      );


      inquiryForm.addEventListener(
        'submit',
        async function (event) {

          event.preventDefault();

          sendButton.disabled = true;

          sendButton.textContent = 'Enviando…';

          inquiryStatus.textContent = '';

          inquiryStatus.style.color = '';


          try {

            const {
              data:{
                user:currentUser
              }
            } =
              await sb.auth.getUser();


            if (!currentUser) {

              throw new Error(
                'Tu sesión expiró. Iniciá sesión nuevamente.'
              );

            }


            const patientName =
              document
                .getElementById('inquiryName')
                .value
                .trim();


            const ageValue =
              document
                .getElementById('inquiryAge')
                .value;


            const patientAge =
              ageValue
                ? Number(ageValue)
                : null;


            const patientWhatsapp =
              document
                .getElementById('inquiryWhatsapp')
                .value
                .trim();


            const patientEmail =
              document
                .getElementById('inquiryEmail')
                .value
                .trim();


            const modality =
              document
                .getElementById('inquiryModality')
                .value;


            const availability =
              document
                .getElementById('inquiryAvailability')
                .value
                .trim();


            const zone =
              document
                .getElementById('inquiryZone')
                .value
                .trim();


            const reason =
              document
                .getElementById('inquiryReason')
                .value;


            const message =
              document
                .getElementById('inquiryMessage')
                .value
                .trim();


            if (!patientName) {

              throw new Error(
                'Ingresá tu nombre y apellido.'
              );

            }


            if (!patientWhatsapp) {

              throw new Error(
                'Ingresá un número de WhatsApp para que el profesional pueda contactarte.'
              );

            }


            if (
              patientWhatsapp.replace(/\D/g,'').length < 8
            ) {

              throw new Error(
                'Ingresá un número de WhatsApp válido.'
              );

            }


            if (
              patientEmail &&
              !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
                patientEmail
              )
            ) {

              throw new Error(
                'Ingresá un email válido o dejá el campo vacío.'
              );

            }


            if (!message) {

              throw new Error(
                'Escribí un mensaje antes de enviar la consulta.'
              );

            }


            const {
              error:insertError
            } =
              await sb
                .from('professional_inquiries')
                .insert({

                  professional_id:id,

                  patient_id:currentUser.id,

                  patient_name:patientName,

                  patient_age:patientAge,

                  patient_whatsapp:
                    patientWhatsapp,

                  patient_email:
                    patientEmail || null,

                  modality:
                    modality || null,

                  availability:
                    availability || null,

                  zone:
                    zone || null,

                  reason:
                    reason || null,

                  message

                });


            if (insertError) {
              throw insertError;
            }


            inquiryForm.reset();

            updateCharacterCounter();

            sendButton.textContent =
              'Consulta enviada ✓';

            sendButton.disabled = true;

            inquiryStatus.textContent =
              'La consulta fue enviada correctamente.';

            inquiryStatus.style.color =
              'var(--accent)';


          } catch (error) {

            console.error(
              'Error enviando consulta:',
              error
            );

            inquiryStatus.textContent =
              error.message ||
              'No se pudo enviar la consulta.';

            inquiryStatus.style.color =
              '#b42318';

            sendButton.disabled = false;

            sendButton.textContent =
              'Enviar consulta';

          }

        }
      );

      return;

    }


    /* =====================================================
       PROFESIONAL
       ===================================================== */

    contactArea.innerHTML = `

      <div class="access-box">

        <div class="small">

          Iniciaste sesión como profesional.
          Para contactar a este profesional
          necesitás utilizar una cuenta de paciente.

        </div>

      </div>

    `;


    inquiryArea.innerHTML = `

      <div
        class="inquiry-card"
        style="
          background:var(--soft);
          box-shadow:none;
        "
      >

        <div class="inquiry-header">

          <div class="inquiry-icon">
            💬
          </div>

          <div>

            <span class="eyebrow">
              Contacto
            </span>

            <h2 class="inquiry-title">
              Enviar consulta
            </h2>

            <p class="inquiry-subtitle">
              Las consultas desde PsiCerca están
              disponibles para cuentas de paciente.
            </p>

          </div>

        </div>

      </div>

    `;


  } catch (error) {

    console.error(
      'Error cargando perfil:',
      error
    );

    box.innerHTML = `

      <div class="empty">

        Este perfil no está disponible
        o no es público.

      </div>

    `;

  }

})();


/* =========================================================
   AGENDA DIGITAL
   ========================================================= */

async function renderAgenda(
  sb,
  professionalId,
  professional,
  user,
  agendaArea
) {

  const today =
    new Date();

  const todayString =
    formatDateInput(today);


  agendaArea.innerHTML = `

    <section class="agenda-card">

      <div class="agenda-header">

        <div class="agenda-icon">
          📅
        </div>

        <div>

          <span class="eyebrow">
            Agenda digital
          </span>

          <h2 class="agenda-title">
            Reservá tu turno
          </h2>

          <p class="agenda-subtitle">
            Elegí una fecha para consultar los horarios
            disponibles con este profesional.
          </p>

        </div>

      </div>


      <div class="agenda-controls">

        <div class="agenda-control">

          <label for="agendaDate">
            Fecha
          </label>

          <input
            id="agendaDate"
            type="date"
            min="${todayString}"
            value="${todayString}"
          >

        </div>


        <div
          class="agenda-control"
          id="agendaModalityControl"
          style="display:none;"
        >

          <label for="agendaModality">
            Modalidad
          </label>

          <select id="agendaModality">

            <option value="virtual">
              Virtual
            </option>

            <option value="presencial">
              Presencial
            </option>

          </select>

        </div>

      </div>


      <div id="agendaSlots">

        <div class="agenda-message">
          Buscando horarios disponibles…
        </div>

      </div>


      <div
        id="agendaConfirm"
        style="display:none;"
      ></div>

    </section>

  `;


  const dateInput =
    document.getElementById('agendaDate');

  const modalityControl =
    document.getElementById(
      'agendaModalityControl'
    );

  const modalitySelect =
    document.getElementById('agendaModality');

  const slotsArea =
    document.getElementById('agendaSlots');

  const confirmArea =
    document.getElementById('agendaConfirm');


  let selectedSlot = null;

  let currentSlots = [];


  /* =======================================================
     NORMALIZAR SLOT
     ======================================================= */

  function normalizeSlot(slot) {

    if (!slot) {
      return null;
    }


    const start =
      slot.slot_start ??
      slot.start_time ??
      slot.start ??
      slot.hora_inicio ??
      null;


    const end =
      slot.slot_end ??
      slot.end_time ??
      slot.end ??
      slot.hora_fin ??
      null;


    const modality =
      slot.modality ??
      slot.modalidad ??
      'virtual';


    const zone =
      slot.zone ??
      slot.zona ??
      null;


    if (!start || !end) {
      return null;
    }


    return {

      slot_start:
        String(start),

      slot_end:
        String(end),

      modality:
        String(modality),

      zone:
        zone
          ? String(zone)
          : null

    };

  }


  /* =======================================================
     CARGAR SLOTS
     ======================================================= */

  async function loadSlots() {

    selectedSlot = null;

    confirmArea.style.display =
      'none';

    confirmArea.innerHTML =
      '';


    slotsArea.innerHTML = `
      <div class="agenda-message">
        Buscando horarios disponibles…
      </div>
    `;


    const selectedDate =
      dateInput.value;


    if (!selectedDate) {

      slotsArea.innerHTML = `
        <div class="agenda-message">
          Seleccioná una fecha.
        </div>
      `;

      return;

    }


    try {

      const {
        data,
        error
      } =
        await sb.rpc(
          'get_available_slots',
          {
            target_professional_id:
              professionalId,

            target_date:
              selectedDate
          }
        );


      if (error) {

        console.error(
          'Error obteniendo turnos:',
          error
        );

        slotsArea.innerHTML = `
          <div class="agenda-message">

            No pudimos cargar los horarios disponibles.

          </div>
        `;

        return;

      }


      console.log(
        'Slots recibidos de Supabase:',
        data
      );


      currentSlots =
        (Array.isArray(data)
          ? data
          : []
        )
        .map(normalizeSlot)
        .filter(Boolean);


      console.log(
        'Slots normalizados:',
        currentSlots
      );


      const hasVirtual =
        currentSlots.some(
          slot =>
            slot.modality === 'virtual' ||
            slot.modality === 'ambas'
        );


      const hasPresencial =
        currentSlots.some(
          slot =>
            slot.modality === 'presencial' ||
            slot.modality === 'ambas'
        );


      if (
        hasVirtual &&
        hasPresencial
      ) {

        modalityControl.style.display =
          'flex';

      } else {

        modalityControl.style.display =
          'none';


        if (hasPresencial) {

          modalitySelect.value =
            'presencial';

        } else {

          modalitySelect.value =
            'virtual';

        }

      }


      if (!currentSlots.length) {

        slotsArea.innerHTML = `
          <div class="agenda-message">

            No hay turnos disponibles para esta fecha.

            <br><br>

            Probá seleccionando otro día.

          </div>
        `;

        return;

      }


      renderSlots();

    } catch (error) {

      console.error(
        'Error cargando agenda:',
        error
      );

      slotsArea.innerHTML = `
        <div class="agenda-message">
          No pudimos cargar la agenda.
        </div>
      `;

    }

  }


  /* =======================================================
     RENDER DE SLOTS
     ======================================================= */

  function renderSlots() {

    const selectedModality =
      modalitySelect.value;


    const filteredSlots =
      currentSlots.filter(
        slot => {

          if (
            slot.modality === 'ambas'
          ) {

            return true;

          }

          return (
            slot.modality ===
            selectedModality
          );

        }
      );


    if (!filteredSlots.length) {

      slotsArea.innerHTML = `
        <div class="agenda-message">

          No hay horarios disponibles para
          la modalidad seleccionada.

        </div>
      `;

      return;

    }


    slotsArea.innerHTML = `

      <div class="agenda-slots">

        ${
          filteredSlots
            .map(
              (slot, index) => {

                const start =
                  slot.slot_start;

                const end =
                  slot.slot_end;


                return `

                  <button
                    type="button"
                    class="agenda-slot"
                    data-index="${index}"
                  >

                    <span class="agenda-slot-time">
                      ${escapeHTML(
                        formatTime(start)
                      )}
                    </span>

                    <small>
                      hasta ${escapeHTML(
                        formatTime(end)
                      )}
                    </small>

                  </button>

                `;

              }
            )
            .join('')
        }

      </div>

    `;


    document
      .querySelectorAll('.agenda-slot')
      .forEach(
        button => {

          button.addEventListener(
            'click',
            function () {

              const index =
                Number(
                  this.dataset.index
                );


              const slot =
                filteredSlots[index];


              if (!slot) {
                return;
              }


              let selectedModality =
                modalitySelect.value;


              if (
                slot.modality ===
                'presencial'
              ) {

                selectedModality =
                  'presencial';

              }


              if (
                slot.modality ===
                'virtual'
              ) {

                selectedModality =
                  'virtual';

              }


              selectedSlot = {

                date:
                  dateInput.value,

                startTime:
                  slot.slot_start,

                endTime:
                  slot.slot_end,

                modality:
                  selectedModality,

                zone:
                  slot.zone || null

              };


              showConfirmation();

            }
          );

        }
      );

  }


  /* =======================================================
     CONFIRMACIÓN
     ======================================================= */

  function showConfirmation() {

    if (!selectedSlot) {
      return;
    }


    const formattedDate =
      formatSpanishDate(
        selectedSlot.date
      );


    const modalityText =
      selectedSlot.modality === 'presencial'
        ? 'Presencial'
        : 'Virtual';


    confirmArea.style.display =
      'block';


    confirmArea.innerHTML = `

      <div class="agenda-confirm">

        <div class="agenda-confirm-title">
          Confirmar turno
        </div>


        <p class="agenda-confirm-details">

          <strong>
            ${escapeHTML(formattedDate)}
          </strong>

          <br>

          ${escapeHTML(
            formatTime(
              selectedSlot.startTime
            )
          )}

          a

          ${escapeHTML(
            formatTime(
              selectedSlot.endTime
            )
          )}

          ·

          ${escapeHTML(modalityText)}

        </p>


        ${
          selectedSlot.zone &&
          selectedSlot.modality === 'presencial'
            ? `
              <p
                class="small"
                style="margin:-6px 0 14px;"
              >
                Zona:
                ${escapeHTML(
                  selectedSlot.zone
                )}
              </p>
            `
            : ''
        }


        ${
          user
            ? `
              <div class="agenda-confirm-actions">

                <button
                  type="button"
                  class="btn primary"
                  id="confirmAppointmentButton"
                >
                  Confirmar turno
                </button>

                <button
                  type="button"
                  class="btn secondary"
                  id="cancelAppointmentSelection"
                >
                  Cancelar
                </button>

              </div>

              <div
                id="bookingStatus"
                class="agenda-status"
              ></div>
            `
            : `
              <div class="access-box">

                <div
                  style="
                    font-weight:700;
                    margin-bottom:6px;
                  "
                >
                  🔐 Iniciá sesión para reservar
                </div>

                <p
                  class="small"
                  style="margin:0 0 12px;"
                >
                  Necesitás una cuenta de paciente
                  para confirmar este turno.
                </p>

                <div
                  style="
                    display:flex;
                    gap:10px;
                    flex-wrap:wrap;
                  "
                >

                  <a
                    href="login.html"
                    class="btn primary"
                  >
                    Iniciar sesión
                  </a>

                  <a
                    href="registro-paciente.html"
                    class="btn secondary"
                  >
                    Crear cuenta
                  </a>

                </div>

              </div>
            `
        }

      </div>

    `;


    const confirmButton =
      document.getElementById(
        'confirmAppointmentButton'
      );


    const cancelButton =
      document.getElementById(
        'cancelAppointmentSelection'
      );


    if (confirmButton) {

      confirmButton.addEventListener(
        'click',
        bookSelectedAppointment
      );

    }


    if (cancelButton) {

      cancelButton.addEventListener(
        'click',
        function () {

          selectedSlot = null;

          confirmArea.style.display =
            'none';

          confirmArea.innerHTML =
            '';

        }
      );

    }

  }


  /* =======================================================
     RESERVAR TURNO
     ======================================================= */

  async function bookSelectedAppointment() {

    if (!selectedSlot) {
      return;
    }


    const button =
      document.getElementById(
        'confirmAppointmentButton'
      );


    const status =
      document.getElementById(
        'bookingStatus'
      );


    if (button) {

      button.disabled = true;

      button.textContent =
        'Reservando…';

    }


    if (status) {

      status.textContent = '';

      status.style.color = '';

    }


    try {

      const {
        data:{
          user:currentUser
        }
      } =
        await sb.auth.getUser();


      if (!currentUser) {

        throw new Error(
          'Tu sesión expiró. Iniciá sesión nuevamente.'
        );

      }


      const {
        data:appointmentId,
        error
      } =
        await sb.rpc(
          'book_appointment',
          {

            target_professional_id:
              professionalId,

            target_date:
              selectedSlot.date,

            target_start_time:
              selectedSlot.startTime,

            target_modality:
              selectedSlot.modality

          }
        );


      if (error) {

        console.error(
          'Error reservando turno:',
          error
        );

        throw error;

      }


      if (!appointmentId) {

        throw new Error(
          'No se pudo confirmar el turno.'
        );

      }


      confirmArea.style.display =
        'block';


      confirmArea.innerHTML = `

        <div class="agenda-confirm">

          <div class="agenda-confirm-title">
            ✅ Turno reservado
          </div>

          <p class="agenda-confirm-details">

            Tu turno con

            <strong>
              ${escapeHTML(
                professional.display_name ||
                'este profesional'
              )}
            </strong>

            quedó reservado para:

            <br><br>

            <strong>
              ${escapeHTML(
                formatSpanishDate(
                  selectedSlot.date
                )
              )}
            </strong>

            <br>

            ${escapeHTML(
              formatTime(
                selectedSlot.startTime
              )
            )}

            a

            ${escapeHTML(
              formatTime(
                selectedSlot.endTime
              )
            )}

            ·

            ${escapeHTML(
              selectedSlot.modality === 'presencial'
                ? 'Presencial'
                : 'Virtual'
            )}

          </p>


          <div class="agenda-message">

            El turno fue registrado correctamente
            en PsiCerca.

          </div>

        </div>

      `;


      /*
       * Actualizamos los horarios disponibles
       * sin borrar el mensaje de confirmación.
       */

      selectedSlot = null;


    } catch (error) {

      console.error(
        'Error reservando turno:',
        error
      );


      if (status) {

        status.textContent =
          error.message ||
          'No se pudo reservar el turno.';

        status.style.color =
          '#b42318';

      }


      if (button) {

        button.disabled = false;

        button.textContent =
          'Confirmar turno';

      }

    }

  }


  /* =======================================================
     EVENTOS
     ======================================================= */

  dateInput.addEventListener(
    'change',
    loadSlots
  );


  modalitySelect.addEventListener(
    'change',
    renderSlots
  );


  await loadSlots();

}


/* =========================================================
   UTILIDADES
   ========================================================= */

function formatDateInput(date) {

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2,'0');

  const day =
    String(
      date.getDate()
    ).padStart(2,'0');

  return `${year}-${month}-${day}`;

}


function formatTime(time) {

  if (!time) {
    return '';
  }


  const value =
    String(time);


  /*
   * PostgreSQL normalmente devuelve TIME
   * como HH:MM:SS.
   */

  if (
    /^\d{2}:\d{2}:\d{2}/.test(value)
  ) {

    return value.slice(0,5);

  }


  if (
    /^\d{2}:\d{2}/.test(value)
  ) {

    return value.slice(0,5);

  }


  return value;

}


function formatSpanishDate(dateString) {

  if (!dateString) {
    return '';
  }


  const parts =
    dateString.split('-');


  if (parts.length !== 3) {
    return dateString;
  }


  const date =
    new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );


  return date.toLocaleDateString(
    'es-AR',
    {
      weekday:'long',
      day:'numeric',
      month:'long',
      year:'numeric'
    }
  );

}
