<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Perfil profesional — PsiCerca</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>

</head>


<body>


<header>

  <div class="container nav">

    <a
      class="logo"
      href="index.html"
    >
      Psi<span>Cerca</span>
    </a>


    <a
      href="profesionales.html"
      class="btn secondary"
    >
      ← Volver al directorio
    </a>

  </div>

</header>


<main
  class="form-wrap"
  style="max-width:760px"
>

  <div
    id="profile"
    class="panel"
  >

    <div class="empty">
      Cargando perfil…
    </div>

  </div>

</main>


<footer class="footer">

  <div class="container">

    PsiCerca · Plataforma tecnológica · 2026

  </div>

</footer>


<script>

(async function () {

  const box =
    document.getElementById('profile');


  const id =
    new URLSearchParams(
      window.location.search
    ).get('id');


  if (!id) {

    box.innerHTML = `
      <div class="empty">
        Perfil no encontrado.
      </div>
    `;

    return;

  }


  try {

    const sb =
      requireSupabase();


    /*
     * =====================================================
     * PERFIL PÚBLICO
     * =====================================================
     */

    const {
      data: p,
      error
    } = await sb

      .from('profiles')

      .select(`
        id,
        display_name,
        license,
        jurisdiction,
        zone,
        modality,
        orientation,
        population,
        bio,
        photo_url
      `)

      .eq('id', id)

      .eq('is_public', true)

      .single();


    if (error) {
      throw error;
    }


    if (!p) {

      throw new Error(
        'Perfil no encontrado'
      );

    }


    /*
     * =====================================================
     * INICIALES
     * =====================================================
     */

    const initials =
      (p.display_name || 'PS')

        .split(' ')

        .filter(Boolean)

        .map(x => x[0])

        .join('')

        .slice(0, 2)

        .toUpperCase();


    /*
     * =====================================================
     * FOTO / AVATAR
     * =====================================================
     */

    const avatar =

      p.photo_url

        ? `

          <div
            class="avatar"
            style="
              width:88px;
              height:88px;
              min-width:88px;
              overflow:hidden;
            "
          >

            <img
              src="${escapeHTML(p.photo_url)}"
              alt="Foto de ${escapeHTML(
                p.display_name || 'profesional'
              )}"
              style="
                width:100%;
                height:100%;
                object-fit:cover;
                border-radius:50%;
                display:block;
              "
            >

          </div>

        `

        : `

          <div
            class="avatar"
            style="
              width:88px;
              height:88px;
              min-width:88px;
            "
          >

            ${escapeHTML(initials)}

          </div>

        `;


    /*
     * =====================================================
     * CHIPS
     * =====================================================
     */

    const chips = [

      p.orientation,

      p.population,

      p.modality,

      p.zone

    ]

      .filter(Boolean)

      .map(x => `

        <span class="chip">

          ${escapeHTML(x)}

        </span>

      `)

      .join('');


    /*
     * =====================================================
     * RENDER DEL PERFIL
     * =====================================================
     */

    box.innerHTML = `

      <!-- ENCABEZADO -->

      <div
        style="
          display:flex;
          align-items:center;
          gap:18px;
          margin-bottom:28px;
        "
      >

        ${avatar}


        <div style="min-width:0;">

          <span class="eyebrow">
            Perfil profesional
          </span>


          <h1
            style="
              margin:4px 0 8px;
              font-size:clamp(32px,5vw,48px);
            "
          >

            ${escapeHTML(
              p.display_name || 'Profesional'
            )}

          </h1>


          <div class="small">

            Matrícula:

            <strong>

              ${escapeHTML(
                p.license || '—'
              )}

            </strong>

            ·

            ${escapeHTML(
              p.jurisdiction || '—'
            )}

          </div>

        </div>

      </div>


      <!-- VERIFICACIÓN EXTERNA -->

      ${
        p.license

          ? `

            <div
              style="
                background:var(--soft);
                border-radius:16px;
                padding:16px 18px;
                margin-bottom:28px;
              "
            >

              <div
                style="
                  font-weight:700;
                  margin-bottom:5px;
                "
              >

                🔎 ¿Querés comprobar la matrícula?

              </div>


              <p
                class="small"
                style="
                  margin:0 0 12px;
                "
              >

                Podés consultar esta matrícula
                directamente en el registro oficial
                del Ministerio de Salud.

              </p>


              <a
                href="https://www.argentina.gob.ar/salud/buscador-nacional-de-profesionales-de-la-salud"
                target="_blank"
                rel="noopener noreferrer"
                class="btn secondary"
                style="font-size:13px;"
              >

                Consultar matrícula en registro oficial

              </a>

            </div>

          `

          : ''

      }


      <!-- INFORMACIÓN PROFESIONAL -->

      ${
        chips

          ? `

            <div
              class="chips"
              style="
                margin:0 0 32px;
              "
            >

              ${chips}

            </div>

          `

          : ''

      }


      <!-- PRESENTACIÓN -->

      <section>

        <h2>
          Sobre mi práctica
        </h2>


        <p
          style="
            white-space:pre-line;
            margin-bottom:28px;
          "
        >

          ${
            escapeHTML(
              p.bio ||
              'El profesional todavía no agregó una presentación.'
            )
          }

        </p>

      </section>


      <!-- CONTACTO -->

      <div
        id="contactArea"
        style="
          margin-top:8px;
          padding-top:24px;
          border-top:1px solid var(--line);
        "
      >

        <div class="small">
          Verificando acceso al contacto…
        </div>

      </div>


      <!-- CONSULTA -->

      <div
        id="inquiryArea"
        style="
          margin-top:32px;
          padding-top:28px;
          border-top:1px solid var(--line);
        "
      >

      </div>


      <!-- ACLARACIONES -->

      <div
        style="
          margin-top:32px;
          padding-top:20px;
          border-top:1px solid var(--line);
        "
      >

        <p
          class="small"
          style="margin:0 0 10px;"
        >

          La información de matrícula es declarada
          por el profesional. PsiCerca recomienda
          verificarla en el

          <a
            href="https://www.argentina.gob.ar/salud/buscador-nacional-de-profesionales-de-la-salud"
            target="_blank"
            rel="noopener noreferrer"
            style="
              color:var(--accent);
              font-weight:700;
            "
          >

            registro oficial del Ministerio de Salud

          </a>.

        </p>


        <p
          class="small"
          style="margin:0;"
        >

          PsiCerca facilita el contacto y no determina
          qué profesional es clínicamente adecuado
          para una persona.

        </p>

      </div>

    `;


    /*
     * =====================================================
     * ELEMENTOS
     * =====================================================
     */

    const contactArea =
      document.getElementById(
        'contactArea'
      );


    const inquiryArea =
      document.getElementById(
        'inquiryArea'
      );


    /*
     * =====================================================
     * USUARIO ACTUAL
     * =====================================================
     */

    const {
      data: {
        user
      }
    } =
      await sb.auth.getUser();


    /*
     * =====================================================
     * SIN SESIÓN
     * =====================================================
     */

    if (!user) {

      contactArea.innerHTML = `

        <div
          style="
            background:var(--soft);
            border-radius:16px;
            padding:18px;
          "
        >

          <div
            style="
              font-weight:700;
              margin-bottom:6px;
            "
          >

            🔐 ¿Querés contactar a este profesional?

          </div>


          <p
            class="small"
            style="
              margin:0 0 15px;
            "
          >

            Creá una cuenta gratuita para
            poder contactar a profesionales
            a través de PsiCerca.

          </p>


          <div
            style="
              display:flex;
              gap:10px;
              flex-wrap:wrap;
            "
          >

            <a
              href="registro-paciente.html"
              class="btn primary"
            >

              Crear cuenta

            </a>


            <a
              href="login.html"
              class="btn secondary"
            >

              Iniciar sesión

            </a>

          </div>

        </div>

      `;


      inquiryArea.innerHTML = `

        <div
          style="
            background:var(--soft);
            border-radius:16px;
            padding:18px;
          "
        >

          <div
            style="
              font-weight:700;
              margin-bottom:6px;
            "
          >

            💬 Enviar una consulta

          </div>


          <p
            class="small"
            style="margin:0;"
          >

            Iniciá sesión o creá una cuenta de paciente
            para enviar una consulta.

          </p>

        </div>

      `;

      return;

    }


    /*
     * =====================================================
     * ROL
     * =====================================================
     */

    const role =
      user.user_metadata?.role;


    /*
     * =====================================================
     * PACIENTE
     * =====================================================
     */

    if (role === 'patient') {


      /*
       * ---------------------------------------------------
       * WHATSAPP
       * ---------------------------------------------------
       */

      const {
        data: contacts,
        error: contactError
      } = await sb.rpc(
        'get_professional_contact',
        {
          target_profile_id: id
        }
      );


      if (
        contactError ||
        !contacts ||
        !contacts.length ||
        !contacts[0].whatsapp
      ) {

        contactArea.innerHTML = `

          <div
            class="small"
            style="
              background:var(--soft);
              border-radius:14px;
              padding:15px;
            "
          >

            Este profesional todavía no
            agregó un medio de contacto.

          </div>

        `;

      } else {

        const whatsapp =
          String(
            contacts[0].whatsapp
          ).replace(/\D/g, '');


        if (whatsapp) {

          contactArea.innerHTML = `

            <a
              class="btn primary"
              target="_blank"
              rel="noopener noreferrer"
              href="https://wa.me/${escapeHTML(whatsapp)}"
            >

              Contactar por WhatsApp

            </a>

          `;

        }

      }


      /*
       * ---------------------------------------------------
       * FORMULARIO DE CONSULTA
       * ---------------------------------------------------
       */

      inquiryArea.innerHTML = `

        <div>

          <span class="eyebrow">
            Contacto
          </span>


          <h2
            style="
              margin:5px 0 8px;
            "
          >
            Enviar consulta
          </h2>


          <p
            class="small"
            style="
              margin:0 0 22px;
            "
          >

            Podés enviarle una consulta inicial a este
            profesional. No incluyas diagnósticos,
            historias clínicas ni información sensible
            innecesaria.

          </p>


          <form
            id="inquiryForm"
          >

            <div
              style="
                display:grid;
                grid-template-columns:
                  repeat(auto-fit,minmax(220px,1fr));
                gap:16px;
              "
            >

              <label>

                <span class="small">
                  Nombre
                </span>

                <input
                  id="inquiryName"
                  type="text"
                  required
                  maxlength="100"
                  placeholder="Tu nombre"
                >

              </label>


              <label>

                <span class="small">
                  Edad
                </span>

                <input
                  id="inquiryAge"
                  type="number"
                  min="1"
                  max="120"
                  placeholder="Edad"
                >

              </label>


              <label>

                <span class="small">
                  Modalidad
                </span>

                <select id="inquiryModality">

                  <option value="">
                    Seleccionar
                  </option>

                  <option value="Presencial">
                    Presencial
                  </option>

                  <option value="Virtual">
                    Virtual
                  </option>

                  <option value="Indistinta">
                    Indistinta
                  </option>

                </select>

              </label>


              <label>

                <span class="small">
                  Zona
                </span>

                <input
                  id="inquiryZone"
                  type="text"
                  maxlength="100"
                  placeholder="Ej.: Avellaneda"
                >

              </label>

            </div>


            <label
              style="
                display:block;
                margin-top:16px;
              "
            >

              <span class="small">
                Disponibilidad
              </span>

              <input
                id="inquiryAvailability"
                type="text"
                maxlength="150"
                placeholder="Ej.: lunes y miércoles por la tarde"
              >

            </label>


            <label
              style="
                display:block;
                margin-top:16px;
              "
            >

              <span class="small">
                Motivo general
              </span>

              <select id="inquiryReason">

                <option value="">
                  Seleccionar
                </option>

                <option value="Inicio de proceso">
                  Inicio de proceso
                </option>

                <option value="Orientación">
                  Orientación
                </option>

                <option value="Consulta personal">
                  Consulta personal
                </option>

                <option value="Consulta de pareja">
                  Consulta de pareja
                </option>

                <option value="Consulta familiar">
                  Consulta familiar
                </option>

                <option value="Otro">
                  Otro
                </option>

              </select>

            </label>


            <label
              style="
                display:block;
                margin-top:16px;
              "
            >

              <span class="small">
                Mensaje
              </span>

              <textarea
                id="inquiryMessage"
                required
                maxlength="1000"
                rows="6"
                placeholder="Contale brevemente qué estás buscando y qué necesitás."
              ></textarea>

            </label>


            <div
              style="
                margin-top:12px;
                padding:14px;
                background:var(--soft);
                border-radius:12px;
              "
            >

              <p
                class="small"
                style="margin:0;"
              >

                Por privacidad, evitá incluir diagnósticos,
                antecedentes clínicos detallados, medicación
                o historias clínicas en este primer contacto.

              </p>

            </div>


            <div
              style="
                display:flex;
                align-items:center;
                gap:12px;
                flex-wrap:wrap;
                margin-top:18px;
              "
            >

              <button
                type="submit"
                class="btn primary"
                id="sendInquiryButton"
              >

                Enviar consulta

              </button>


              <span
                id="inquiryMessageStatus"
                class="small"
              ></span>

            </div>


          </form>

        </div>

      `;


      /*
       * ---------------------------------------------------
       * ENVÍO DE CONSULTA
       * ---------------------------------------------------
       */

      const inquiryForm =
        document.getElementById(
          'inquiryForm'
        );


      const sendButton =
        document.getElementById(
          'sendInquiryButton'
        );


      const inquiryStatus =
        document.getElementById(
          'inquiryMessageStatus'
        );


      inquiryForm.addEventListener(
        'submit',
        async function (event) {

          event.preventDefault();


          sendButton.disabled = true;

          sendButton.textContent =
            'Enviando…';

          inquiryStatus.textContent =
            '';


          try {

            /*
             * Verificamos nuevamente
             * que siga existiendo la sesión.
             */

            const {
              data: {
                user: currentUser
              }
            } =
              await sb.auth.getUser();


            if (!currentUser) {

              throw new Error(
                'Tu sesión expiró. Iniciá sesión nuevamente.'
              );

            }


            const patientName =
              document.getElementById(
                'inquiryName'
              ).value.trim();


            const ageValue =
              document.getElementById(
                'inquiryAge'
              ).value;


            const patientAge =
              ageValue
                ? Number(ageValue)
                : null;


            const modality =
              document.getElementById(
                'inquiryModality'
              ).value;


            const availability =
              document.getElementById(
                'inquiryAvailability'
              ).value.trim();


            const zone =
              document.getElementById(
                'inquiryZone'
              ).value.trim();


            const reason =
              document.getElementById(
                'inquiryReason'
              ).value;


            const message =
              document.getElementById(
                'inquiryMessage'
              ).value.trim();


            if (!patientName) {

              throw new Error(
                'Ingresá tu nombre.'
              );

            }


            if (!message) {

              throw new Error(
                'Escribí un mensaje antes de enviar la consulta.'
              );

            }


            /*
             * Insertamos la consulta.
             *
             * patient_id se toma directamente
             * del usuario autenticado.
             */

            const {
              error: insertError
            } = await sb

              .from('professional_inquiries')

              .insert({

                professional_id: id,

                patient_id: currentUser.id,

                patient_name: patientName,

                patient_age: patientAge,

                modality:
                  modality || null,

                availability:
                  availability || null,

                zone:
                  zone || null,

                reason:
                  reason || null,

                message

              });


            if (insertError) {

              console.error(
                'Error creando consulta:',
                insertError
              );

              throw insertError;

            }


            /*
             * ÉXITO
             */

            inquiryForm.reset();


            inquiryStatus.textContent =
              '✓ Consulta enviada correctamente.';


            inquiryStatus.style.color =
              'var(--accent)';


            sendButton.textContent =
              'Consulta enviada';


          } catch (error) {

            console.error(
              'Error enviando consulta:',
              error
            );


            inquiryStatus.textContent =
              error.message ||
              'No se pudo enviar la consulta.';


            inquiryStatus.style.color =
              '#b42318';


            sendButton.disabled =
              false;


            sendButton.textContent =
              'Enviar consulta';

          }

        }
      );


      return;

    }


    /*
     * =====================================================
     * PROFESIONAL
     * =====================================================
     */

    contactArea.innerHTML = `

      <div
        class="small"
        style="
          background:var(--soft);
          border-radius:14px;
          padding:15px;
        "
      >

        Iniciaste sesión como profesional.
        Para contactar a este profesional
        necesitás utilizar una cuenta de paciente.

      </div>

    `;


    inquiryArea.innerHTML = `

      <div
        class="small"
        style="
          background:var(--soft);
          border-radius:14px;
          padding:15px;
        "
      >

        Las consultas desde PsiCerca están
        disponibles para cuentas de paciente.

      </div>

    `;


  } catch (error) {

    console.error(
      'Error cargando perfil:',
      error
    );


    box.innerHTML = `

      <div class="empty">

        Este perfil no está disponible
        o no es público.

      </div>

    `;

  }


})();

</script>


</body>

</html>
