<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil profesional — PsiCerca</title><link rel="stylesheet" href="css/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script></head><body><header><div class="container nav"><a class="logo" href="index.html">Psi<span>Cerca</span></a><a href="profesionales.html" class="btn secondary">← Volver al directorio</a></div></header><main class="form-wrap" style="max-width:760px"><div id="profile" class="panel"><div class="empty">Cargando perfil…</div></div></main><script>(async()=>{const id=new URLSearchParams(location.search).get('id');const box=document.getElementById('profile');if(!id){box.innerHTML='<div class="empty">Perfil no encontrado.</div>';return}try{const {data:p,error}=await requireSupabase().from('profiles').select('display_name,license,jurisdiction,zone,modality,orientation,population,bio,whatsapp').eq('id',id).eq('is_public',true).single();if(error)throw error;const initials=(p.display_name||'PS').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();const wa=(p.whatsapp||'').replace(/\D/g,'');box.innerHTML=`<div class="pro-top"><div class="avatar" style="width:72px;height:72px">${escapeHTML(initials)}</div><div><span class="eyebrow">Perfil profesional</span><h1>${escapeHTML(p.display_name)}</h1><div class="small">Matrícula ${escapeHTML(p.license)} · ${escapeHTML(p.jurisdiction)}</div></div></div><div class="chips" style="margin-top:25px">${[p.orientation,p.population,p.modality,p.zone].filter(Boolean).map(x=>`<span class="chip">${escapeHTML(x)}</span>`).join('')}</div><h2>Sobre mi práctica</h2><p>${escapeHTML(p.bio||'El profesional todavía no agregó una presentación.')}</p>${wa?`<a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/${wa}">Contactar por WhatsApp</a>`:''}<p class="small" style="margin-top:20px">PsiCerca facilita el contacto y no determina qué profesional es clínicamente adecuado para una persona.</p>`}catch(err){box.innerHTML='<div class="empty">Este perfil no está disponible o no es público.</div>'}})()</script></body></html>
