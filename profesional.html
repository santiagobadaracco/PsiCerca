<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Perfil profesional — PsiCerca</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>

  <style>

    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .profile-avatar {
      width: 88px;
      height: 88px;
      min-width: 88px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--soft);
      font-weight: 800;
      font-size: 24px;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* =====================================================
       AGENDA DIGITAL
       ===================================================== */

    .agenda-card {
      margin-top: 34px;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .045);
    }

    .agenda-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 24px;
    }

    .agenda-icon {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 14px;
      background: var(--soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .agenda-title {
      margin: 2px 0 5px;
      font-size: 25px;
      line-height: 1.15;
    }

    .agenda-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    /* =====================================================
       CALENDARIO
       ===================================================== */

    .agenda-calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding: 0 2px;
    }

    .agenda-month-title {
      flex: 1;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
    }

    .agenda-month-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 27px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .15s ease;
    }

    .agenda-month-button:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .agenda-month-button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .agenda-calendar {
      width: 100%;
    }

    .agenda-weekdays {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 7px;
    }

    .agenda-weekday {
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .agenda-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 7px;
    }

    .agenda-day {
      position: relative;
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      transition: .15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px;
    }

    .agenda-day:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--soft);
      transform: translateY(-1px);
    }

    .agenda-day-number {
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
    }

    .agenda-day-label {
      font-size: 9px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }

    .agenda-day-today {
      border-color: var(--accent);
    }

    .agenda-day-selected {
      background: var(--accent) !important;
      border-color: var(--accent) !important;
      color: #fff !important;
      box-shadow: 0 5px 14px rgba(40, 125, 114, .18);
    }

    .agenda-day-selected .agenda-day-label {
      color: #fff;
    }

    .agenda-day-disabled {
      background: #f7f7f7;
      color: #b8b8b8;
      cursor: not-allowed;
      border-color: #eeeeee;
    }

    .agenda-day-empty {
      border-color: transparent;
      background: transparent;
      cursor: default;
    }

    /* =====================================================
       FECHA SELECCIONADA
       ===================================================== */

    .agenda-selected-date {
      margin-top: 22px;
      padding: 16px 18px;
      border-radius: 15px;
      background: var(--soft);
    }

    .agenda-selected-date-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 4px;
    }

    .agenda-selected-date-value {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      text-transform: capitalize;
    }

    /* =====================================================
       MODALIDAD
       ===================================================== */

    .agenda-modality {
      margin-top: 18px;
    }

    .agenda-section-label {
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 800;
    }

    .agenda-modality-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .agenda-modality-option {
      min-height: 62px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      text-align: left;
      font: inherit;
      transition: .15s ease;
    }

    .agenda-modality-option:hover {
      border-color: var(--accent);
    }

    .agenda-modality-option.is-selected {
      border-color: var(--accent);
      background: var(--soft);
    }

    .agenda-modality-dot {
      width: 10px;
      height: 10px;
      min-width: 10px;
      border-radius: 50%;
      background: #c7c7c7;
    }

    .agenda-modality-option.is-selected .agenda-modality-dot {
      background: var(--accent);
    }

    .agenda-modality-option strong {
      display: block;
      font-size: 13px;
    }

    .agenda-modality-option small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    /* =====================================================
       HORARIOS
       ===================================================== */

    .agenda-slots-area {
      margin-top: 22px;
    }

    .agenda-slots {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .agenda-slot {
      width: 100%;
      min-height: 64px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      font: inherit;
      transition: .15s ease;
      padding: 11px;
      text-align: center;
    }

    .agenda-slot:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: var(--soft);
    }

    .agenda-slot.is-selected {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      box-shadow: 0 5px 14px rgba(40, 125, 114, .18);
    }

    .agenda-slot-time {
      display: block;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;
    }

    .agenda-slot-end {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }

    .agenda-slot.is-selected .agenda-slot-end {
      color: rgba(255, 255, 255, .82);
    }

    /* =====================================================
       MENSAJES
       ===================================================== */

    .agenda-message {
      padding: 16px;
      border-radius: 14px;
      background: var(--soft);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .agenda-message-empty {
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: center;
      text-align: center;
      padding: 24px 16px;
    }

    .agenda-message-icon {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .agenda-message-empty strong {
      color: var(--text);
      font-size: 14px;
    }

    .agenda-message-empty span {
      color: var(--muted);
      font-size: 12px;
    }

    /* =====================================================
       CONFIRMACIÓN
       ===================================================== */

    .agenda-confirm {
      margin-top: 20px;
      padding: 20px;
      border-radius: 16px;
      background: var(--soft);
    }

    .agenda-confirm-title {
      font-weight: 800;
      margin-bottom: 12px;
      font-size: 18px;
    }

    .agenda-confirm-summary {
      display: grid;
      gap: 9px;
      margin-bottom: 14px;
    }

    .agenda-confirm-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 14px;
    }

    .agenda-confirm-label {
      color: var(--muted);
    }

    .agenda-confirm-zone {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fff;
      font-size: 13px;
    }

    .agenda-confirm-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .agenda-status {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .agenda-confirm-success {
      text-align: center;
    }

    .agenda-success-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
    }

    .agenda-success-details {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin: 14px 0 18px;
      padding: 15px;
      border-radius: 14px;
      background: #fff;
    }

    .agenda-success-details span {
      font-size: 13px;
      color: var(--muted);
    }

    /* =====================================================
       CONSULTA
       ===================================================== */

    .inquiry-card {
      margin-top: 34px;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .045);
    }

    .inquiry-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 24px;
    }

    .inquiry-icon {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 14px;
      background: var(--soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .inquiry-title {
      margin: 2px 0 5px;
      font-size: 25px;
      line-height: 1.15;
    }

    .inquiry-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .inquiry-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .inquiry-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .inquiry-field.full {
      grid-column: 1 / -1;
    }

    .inquiry-label {
      font-size: 13px;
      font-weight: 700;
    }

    .inquiry-field input,
    .inquiry-field select,
    .inquiry-field textarea {
      width: 100%;
      box-sizing: border-box;
    }

    .inquiry-hint {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    .inquiry-textarea-wrap {
      position: relative;
    }

    .inquiry-textarea-wrap textarea {
      padding-bottom: 34px;
      resize: vertical;
      min-height: 150px;
    }

    .character-counter {
      position: absolute;
      right: 12px;
      bottom: 10px;
      font-size: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    .privacy-box {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--soft);
    }

    .privacy-icon {
      font-size: 17px;
      line-height: 1.3;
    }

    .privacy-text {
      margin: 0;
      font-size: 12px;
      line-height: 1.55;
      color: var(--muted);
    }

    .inquiry-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .inquiry-submit {
      min-width: 160px;
      justify-content: center;
    }

    .inquiry-submit:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .inquiry-status {
      font-size: 13px;
      font-weight: 600;
    }

    /* =====================================================
       CONTACTO
       ===================================================== */

    .contact-note {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--soft);
      font-size: 12px;
      line-height: 1.55;
      color: var(--muted);
    }

    .whatsapp-area {
      margin-top: 8px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .whatsapp-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px;
      border-radius: 16px;
      background: var(--soft);
    }

    .whatsapp-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .whatsapp-description {
      margin: 0;
    }

    .access-box {
      background: var(--soft);
      border-radius: 16px;
      padding: 18px;
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 650px) {

      .profile-header {
        align-items: flex-start;
        gap: 14px;
      }

      .profile-avatar {
        width: 70px;
        height: 70px;
        min-width: 70px;
        font-size: 20px;
      }

      .agenda-card,
      .inquiry-card {
        padding: 20px;
        border-radius: 18px;
      }

      .agenda-days,
      .agenda-weekdays {
        gap: 5px;
      }

      .agenda-day {
        min-height: 50px;
        border-radius: 11px;
      }

      .agenda-day-number {
        font-size: 14px;
      }

      .agenda-weekday {
        font-size: 9px;
      }

      .agenda-month-title {
        font-size: 18px;
      }

      .agenda-month-button {
        width: 38px;
        height: 38px;
      }

      .agenda-modality-options {
        grid-template-columns: 1fr;
      }

      .agenda-slots {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .agenda-confirm-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }

      .agenda-confirm-actions {
        flex-direction: column;
      }

      .agenda-confirm-actions .btn {
        width: 100%;
        justify-content: center;
      }

      .inquiry-fields {
        grid-template-columns: 1fr;
      }

      .inquiry-field.full {
        grid-column: auto;
      }

      .inquiry-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .inquiry-submit {
        width: 100%;
      }

      .whatsapp-box {
        align-items: stretch;
        flex-direction: column;
      }

      .whatsapp-box .btn {
        width: 100%;
        justify-content: center;
      }

    }

  </style>

</head>

<body>

<header>

  <div class="container nav">

    <a
      class="logo"
      href="index.html"
    >
      Psi<span>Cerca</span>
    </a>

    <a
      href="profesionales.html"
      class="btn secondary"
    >
      ← Volver al directorio
    </a>

  </div>

</header>

<main
  class="form-wrap"
  style="max-width:760px"
>

  <div
    id="profile"
    class="panel"
  >

    <div class="empty">
      Cargando perfil…
    </div>

  </div>

</main>

<footer class="footer">

  <div class="container">
    PsiCerca · Plataforma tecnológica · 2026
  </div>

</footer>

<script>

(async function () {

  const box =
    document.getElementById('profile');

  const id =
    new URLSearchParams(
      window.location.search
    ).get('id');

  if (!id) {

    box.innerHTML = `
      <div class="empty">
        Perfil no encontrado.
      </div>
    `;

    return;

  }

  try {

    const sb =
      requireSupabase();

    /* =====================================================
       PERFIL PÚBLICO
       ===================================================== */

    const {
      data: p,
      error
    } = await sb
      .from('profiles')
      .select(`
        id,
        display_name,
        license,
        jurisdiction,
        zone,
        modality,
        orientation,
        population,
        bio,
        photo_url
      `)
      .eq('id', id)
      .eq('is_public', true)
      .single();

    if (error) {
      throw error;
    }

    if (!p) {
      throw new Error('Perfil no encontrado');
    }

    /* =====================================================
       ESTADÍSTICA — VISITA AL PERFIL
       ===================================================== */

    try {

      let visitorId =
        localStorage.getItem(
          'psicerca_visitor_id'
        );

      if (!visitorId) {

        if (
          window.crypto &&
          typeof window.crypto.randomUUID === 'function'
        ) {

          visitorId =
            window.crypto.randomUUID();

        } else {

          visitorId =
            `${Date.now()}-${Math.random()
              .toString(36)
              .slice(2)}`;

        }

        localStorage.setItem(
          'psicerca_visitor_id',
          visitorId
        );

      }

      await sb.rpc(
        'record_professional_profile_event',
        {
          target_professional_id:
            id,

          target_event_type:
            'profile_view',

          target_visitor_id:
            visitorId
        }
      );

    } catch (eventError) {

      console.error(
        'No se pudo registrar la visita:',
        eventError
      );

    }

    /* =====================================================
       INICIALES
       ===================================================== */

    const initials =
      (p.display_name || 'PS')
        .split(' ')
        .filter(Boolean)
        .map(x => x[0])
        .join('')
        .slice(0, 2)
        .toUpperCase();

    /* =====================================================
       FOTO / AVATAR
       ===================================================== */

    const avatar =
      p.photo_url
        ? `
          <div class="profile-avatar">

            <img
              src="${escapeHTML(p.photo_url)}"
              alt="Foto de ${escapeHTML(
                p.display_name || 'profesional'
              )}"
            >

          </div>
        `
        : `
          <div class="profile-avatar">
            ${escapeHTML(initials)}
          </div>
        `;

    /* =====================================================
       CHIPS
       ===================================================== */

    const chips = [
      p.orientation,
      p.population,
      p.modality,
      p.zone
    ]
      .filter(Boolean)
      .map(x => `
        <span class="chip">
          ${escapeHTML(x)}
        </span>
      `)
      .join('');

    /* =====================================================
       PERFIL
       ===================================================== */

    box.innerHTML = `

      <div class="profile-header">

        ${avatar}

        <div style="min-width:0;">

          <span class="eyebrow">
            Perfil profesional
          </span>

          <h1
            style="
              margin:4px 0 8px;
              font-size:clamp(32px,5vw,48px);
            "
          >
            ${escapeHTML(
              p.display_name || 'Profesional'
            )}
          </h1>

          <div class="small">

            Matrícula:

            <strong>
              ${escapeHTML(
                p.license || '—'
              )}
            </strong>

            ·

            ${escapeHTML(
              p.jurisdiction || '—'
            )}

          </div>

        </div>

      </div>

      ${
        p.license
          ? `
            <div
              style="
                background:var(--soft);
                border-radius:16px;
                padding:16px 18px;
                margin-bottom:28px;
              "
            >

              <div
                style="
                  font-weight:700;
                  margin-bottom:5px;
                "
              >
                🔎 ¿Querés comprobar la matrícula?
              </div>

              <p
                class="small"
                style="margin:0 0 12px;"
              >
                Podés consultar esta matrícula
                directamente en el registro oficial
                del Ministerio de Salud.
              </p>

              <a
                href="https://www.argentina.gob.ar/salud/buscador-nacional-de-profesionales-de-la-salud"
                target="_blank"
                rel="noopener noreferrer"
                class="btn secondary"
                style="font-size:13px;"
              >
                Consultar matrícula en registro oficial
              </a>

            </div>
          `
          : ''
      }

      ${
        chips
          ? `
            <div
              class="chips"
              style="margin:0 0 32px;"
            >
              ${chips}
            </div>
          `
          : ''
      }

      <section>

        <h2>
          Sobre mi práctica
        </h2>

        <p
          style="
            white-space:pre-line;
            margin-bottom:28px;
          "
        >
          ${
            escapeHTML(
              p.bio ||
              'El profesional todavía no agregó una presentación.'
            )
          }
        </p>

      </section>

      <div id="agendaArea"></div>

      <div
        id="contactArea"
        class="whatsapp-area"
      >

        <div class="small">
          Verificando acceso al contacto…
        </div>

      </div>

      <div id="inquiryArea"></div>

      <div
        style="

        id="agendaConfirm"
        style="display:none;"
      ></div>

    </section>

  `;

  const calendarArea =
    document.getElementById(
      'agendaCalendar'
    );

  const monthTitle =
    document.getElementById(
      'agendaMonthTitle'
    );

  const previousMonthButton =
    document.getElementById(
      'agendaPreviousMonth'
    );

  const nextMonthButton =
    document.getElementById(
      'agendaNextMonth'
    );

  const selectedDateArea =
    document.getElementById(
      'agendaSelectedDate'
    );

  const modalityControl =
    document.getElementById(
      'agendaModalityControl'
    );

  const modalitySelect =
    document.getElementById(
      'agendaModality'
    );

  const modalityButtons =
    modalityControl.querySelectorAll(
      '.agenda-modality-option'
    );

  const slotsArea =
    document.getElementById(
      'agendaSlots'
    );

  const confirmArea =
    document.getElementById(
      'agendaConfirm'
    );


  /* =======================================================
     NORMALIZAR SLOT
     ======================================================= */

  function normalizeSlot(slot) {

    if (!slot) {
      return null;
    }

    const start =
      slot.slot_start ??
      slot.slot_start_time ??
      slot.start_time ??
      slot.start ??
      slot.hora_inicio ??
      null;

    const end =
      slot.slot_end ??
      slot.slot_end_time ??
      slot.end_time ??
      slot.end ??
      slot.hora_fin ??
      null;

    const modality =
      slot.modality ??
      slot.modalidad ??
      'virtual';

    const zone =
      slot.zone ??
      slot.zona ??
      null;

    if (
      start === null ||
      start === undefined ||
      end === null ||
      end === undefined
    ) {

      console.warn(
        'Slot descartado por no tener inicio/fin:',
        slot
      );

      return null;

    }

    return {

      slot_start:
        String(start),

      slot_end:
        String(end),

      modality:
        String(modality).toLowerCase(),

      zone:
        zone !== null &&
        zone !== undefined &&
        String(zone).trim()
          ? String(zone)
          : null

    };

  }


  /* =======================================================
     NOMBRE DEL MES
     ======================================================= */

  function getMonthName(date) {

    const value =
      date.toLocaleDateString(
        'es-AR',
        {
          month: 'long',
          year: 'numeric'
        }
      );

    return (
      value.charAt(0).toUpperCase() +
      value.slice(1)
    );

  }


  /* =======================================================
     CALENDARIO
     ======================================================= */

  function renderCalendar() {

    monthTitle.textContent =
      getMonthName(currentMonth);

    const year =
      currentMonth.getFullYear();

    const month =
      currentMonth.getMonth();

    const firstDay =
      new Date(
        year,
        month,
        1
      );

    const lastDay =
      new Date(
        year,
        month + 1,
        0
      );

    let startDay =
      firstDay.getDay();

    /*
      JS:
      Domingo = 0
      Lunes = 1
      ...
      Domingo debe quedar como séptimo día.
    */

    startDay =
      startDay === 0
        ? 6
        : startDay - 1;

    const totalDays =
      lastDay.getDate();

    const weekdayNames = [
      'Lun',
      'Mar',
      'Mié',
      'Jue',
      'Vie',
      'Sáb',
      'Dom'
    ];

    let html = `

      <div class="agenda-weekdays">

        ${
          weekdayNames
            .map(
              day => `
                <div class="agenda-weekday">
                  ${day}
                </div>
              `
            )
            .join('')
        }

      </div>

      <div class="agenda-days">
    `;

    for (
      let i = 0;
      i < startDay;
      i++
    ) {

      html += `

        <div
          class="agenda-day agenda-day-empty"
          aria-hidden="true"
        ></div>

      `;

    }

    for (
      let day = 1;
      day <= totalDays;
      day++
    ) {

      const date =
        new Date(
          year,
          month,
          day
        );

      date.setHours(
        0,
        0,
        0,
        0
      );

      const dateString =
        formatDateInput(date);

      const isPast =
        date < today;

      const isSelected =
        dateString === selectedDate;

      const isToday =
        dateString === todayString;

      html += `

        <button
          type="button"
          class="
            agenda-day
            ${isPast ? 'agenda-day-disabled' : ''}
            ${isSelected ? 'agenda-day-selected' : ''}
            ${isToday ? 'agenda-day-today' : ''}
          "
          data-date="${dateString}"
          ${isPast ? 'disabled' : ''}
        >

          <span class="agenda-day-number">
            ${day}
          </span>

          ${
            isToday
              ? `
                <span class="agenda-day-label">
                  Hoy
                </span>
              `
              : ''
          }

        </button>

      `;

    }

    html += `

      </div>

    `;

    calendarArea.innerHTML =
      html;

    calendarArea
      .querySelectorAll(
        '.agenda-day:not(.agenda-day-disabled)'
      )
      .forEach(
        button => {

          button.addEventListener(
            'click',
            async function () {

              const date =
                this.dataset.date;

              if (!date) {
                return;
              }

              selectedDate =
                date;

              renderCalendar();

              await loadSlots();

            }
          );

        }
      );

    const minimumMonth =
      new Date(
        today.getFullYear(),
        today.getMonth(),
        1
      );

    const currentMonthStart =
      new Date(
        currentMonth.getFullYear(),
        currentMonth.getMonth(),
        1
      );

    previousMonthButton.disabled =
      currentMonthStart <= minimumMonth;

  }


  /* =======================================================
     ACTUALIZAR MODALIDAD VISUAL
     ======================================================= */

  function updateModalityUI() {

    modalityButtons.forEach(
      button => {

        button.classList.toggle(
          'is-selected',
          button.dataset.modality ===
            modalitySelect.value
        );

      }
    );

  }


  modalityButtons.forEach(
    button => {

      button.addEventListener(
        'click',
        async function () {

          const modality =
            this.dataset.modality;

          if (!modality) {
            return;
          }

          modalitySelect.value =
            modality;

          updateModalityUI();

          renderSlots();

        }
      );

    }
  );


  /* =======================================================
     CARGAR SLOTS
     ======================================================= */

  async function loadSlots() {
    
  console.log('LOADSLOTS SE EJECUTÓ');
  selectedSlot = null;

  confirmArea.style.display =
    'none';

  confirmArea.innerHTML =
    '';

  slotsArea.innerHTML = `
    <div class="agenda-message">
      Buscando horarios disponibles…
    </div>
  `;

  selectedDateArea.innerHTML = `

    <span>
      Turnos disponibles
    </span>

    <strong>
      ${escapeHTML(
        formatSpanishDate(selectedDate)
      )}
    </strong>

  `;

  try {

    /*
      Consultamos ambas modalidades.

      La versión anterior consultaba solamente
      la modalidad seleccionada inicialmente
      (virtual). Por eso, si existía además
      disponibilidad presencial, nunca llegaba
      a detectarla.
    */

   const virtualResult =
  await sb.rpc(
    'get_available_slots',
    {
      target_professional_id:
        professionalId,

      target_date:
        selectedDate,

      target_modality:
        'virtual'
    }
  );

console.log(
  'RESULTADO VIRTUAL:',
  virtualResult
);

const presencialResult =
  await sb.rpc(
    'get_available_slots',
    {
      target_professional_id:
        professionalId,

      target_date:
        selectedDate,

      target_modality:
        'presencial'
    }
  );

console.log(
  'RESULTADO PRESENCIAL:',
  presencialResult
);

    /*
      Si alguna consulta devuelve error,
      lo mostramos en consola pero dejamos
      continuar la otra consulta.
    */

    if (virtualResult.error) {

      console.error(
        'Error obteniendo turnos virtuales:',
        virtualResult.error
      );

    }

    if (presencialResult.error) {

      console.error(
        'Error obteniendo turnos presenciales:',
        presencialResult.error
      );

    }

    const virtualSlots =
      Array.isArray(
        virtualResult.data
      )
        ? virtualResult.data
        : [];

    const presencialSlots =
      Array.isArray(
        presencialResult.data
      )
        ? presencialResult.data
        : [];

    /*
      Unimos ambas respuestas.
    */

    const combinedSlots = [
      ...virtualSlots,
      ...presencialSlots
    ];

    /*
      Normalizamos y eliminamos duplicados.
    */

    const normalizedSlots =
      combinedSlots
        .map(normalizeSlot)
        .filter(Boolean);

    currentSlots =
      normalizedSlots.filter(
        (slot, index, array) => {

          return (
            index ===
            array.findIndex(
              other =>
                other.slot_start ===
                  slot.slot_start &&

                other.slot_end ===
                  slot.slot_end &&

                other.modality ===
                  slot.modality &&

                other.zone ===
                  slot.zone
            )
          );

        }
      );

    /*
      Detectamos qué modalidades existen.
    */

    const hasVirtual =
      currentSlots.some(
        slot =>
          slot.modality === 'virtual' ||
          slot.modality === 'ambas'
      );

    const hasPresencial =
      currentSlots.some(
        slot =>
          slot.modality === 'presencial' ||
          slot.modality === 'ambas'
      );

    /*
      Si existen ambas modalidades,
      mostramos el selector.
    */

    if (
      hasVirtual &&
      hasPresencial
    ) {

      modalityControl.style.display =
        'flex';

    } else {

      modalityControl.style.display =
        'none';

      if (hasPresencial) {

        modalitySelect.value =
          'presencial';

      } else {

        modalitySelect.value =
          'virtual';

      }

    }

    /*
      Si no hay ningún horario,
      mostramos el mensaje correspondiente.
    */

    if (!currentSlots.length) {

      slotsArea.innerHTML = `

        <div class="agenda-message">

          <strong>
            No hay turnos disponibles
          </strong>

          <br>

          Probá seleccionando otro día.

        </div>

      `;

      return;

    }

    /*
      IMPORTANTE:
      renderSlots() sigue siendo la función
      original que está inmediatamente
      después de este bloque.
    */

    renderSlots();

  } catch (error) {

    console.error(
      'Error cargando agenda:',
      error
    );

    slotsArea.innerHTML = `
      <div class="agenda-message">
        No pudimos cargar la agenda.
      </div>
    `;

  }

}
function renderSlots() {

  const virtualSlots =
    currentSlots.filter(
      slot =>
        slot.modality === 'virtual' ||
        slot.modality === 'ambas'
    );

  const presencialSlots =
    currentSlots.filter(
      slot =>
        slot.modality === 'presencial' ||
        slot.modality === 'ambas'
    );

  function renderSlotButtons(slots) {

    return slots
      .map(
        (slot, index) => {

          const start =
            formatTime(
              slot.slot_start
            );

          const end =
            formatTime(
              slot.slot_end
            );

          if (!start || !end) {
            return '';
          }

          return `

            <button
              type="button"
              class="agenda-slot"
              data-modality="${escapeHTML(slot._displayModality || slot.modality)}"
              data-start="${escapeHTML(slot.slot_start)}"
              data-end="${escapeHTML(slot.slot_end)}"
              data-zone="${escapeHTML(slot.zone || '')}"
            >

              <span class="agenda-slot-time">
                ${escapeHTML(start)}
              </span>

              <small>
                hasta ${escapeHTML(end)}
              </small>

            </button>

          `;

        }
      )
      .join('');

  }

  let html = '';

  /*
    ==========================
    VIRTUAL
    ==========================
  */

  if (virtualSlots.length) {

    html += `

      <div class="agenda-modality-group">

        <div class="agenda-section-label">
          💻 Virtual
        </div>

        <div class="agenda-slots">

          ${renderSlotButtons(
  virtualSlots.map(slot => ({
    ...slot,
    _displayModality: 'virtual'
  }))
)}
        </div>

      </div>

    `;

  }

  /*
    ==========================
    PRESENCIAL
    ==========================
  */

  if (presencialSlots.length) {

    html += `

      <div class="agenda-modality-group">

        <div class="agenda-section-label">
          📍 Presencial
        </div>

        <div class="agenda-slots">

          ${renderSlotButtons(
  presencialSlots.map(slot => ({
    ...slot,
    _displayModality: 'presencial'
  }))
)}

        </div>

      </div>

    `;

  }

  /*
    ==========================
    SIN HORARIOS
    ==========================
  */

  if (!html) {

    slotsArea.innerHTML = `

      <div class="agenda-message">

        No hay horarios disponibles.

      </div>

    `;

    return;

  }

  slotsArea.innerHTML = html;

  /*
    ==========================
    SELECCIÓN DE TURNO
    ==========================
  */

  slotsArea
    .querySelectorAll(
      '.agenda-slot'
    )
    .forEach(
      button => {

        button.addEventListener(
          'click',
          function () {

            const modality =
              this.dataset.modality;

            const startTime =
              this.dataset.start;

            const endTime =
              this.dataset.end;

            const zone =
              this.dataset.zone ||
              null;

           selectedSlot = {

  date:
    selectedDate,

  startTime:
    startTime,

  endTime:
    endTime,

  modality:
    modality,

  zone:
    zone

};

            showConfirmation();

          }
        );

      }
    );

}
  /* =======================================================
     CONFIRMACIÓN
     ======================================================= */

  function showConfirmation() {

    if (!selectedSlot) {
      return;
    }

    const formattedDate =
      formatSpanishDate(
        selectedSlot.date
      );

    const modalityText =
      selectedSlot.modality === 'presencial'
        ? 'Presencial'
        : 'Virtual';

    confirmArea.style.display =
      'block';

    confirmArea.innerHTML = `

      <div class="agenda-confirm">

        <div class="agenda-confirm-title">
          Confirmá tu turno
        </div>

        <div class="agenda-confirm-summary">

          <div class="agenda-confirm-row">

            <span class="agenda-confirm-label">
              Día
            </span>

            <strong>
              ${escapeHTML(formattedDate)}
            </strong>

          </div>

          <div class="agenda-confirm-row">

            <span class="agenda-confirm-label">
              Horario
            </span>

            <strong>

              ${escapeHTML(
                formatTime(
                  selectedSlot.startTime
                )
              )}

              –

              ${escapeHTML(
                formatTime(
                  selectedSlot.endTime
                )
              )}

            </strong>

          </div>

          <div class="agenda-confirm-row">

            <span class="agenda-confirm-label">
              Modalidad
            </span>

            <strong>
              ${escapeHTML(modalityText)}
            </strong>

          </div>

        </div>

        ${
          selectedSlot.zone &&
          selectedSlot.modality === 'presencial'
            ? `
              <div class="agenda-confirm-zone">

                📍 ${escapeHTML(
                  selectedSlot.zone
                )}

              </div>
            `
            : ''
        }

        ${
          user
            ? `

             <div class="agenda-confirm-contact">

  <label for="patientPhone">
    Teléfono de contacto <span>*</span>
  </label>

  <input
    type="tel"
    id="patientPhone"
    name="patientPhone"
    placeholder="Ej.: 11 1234-5678"
    autocomplete="tel"
    required
  >

  <p class="small">
    Si el profesional acepta tu solicitud, utilizará este número
    para comunicarse con vos.
  </p>

</div>

<div class="agenda-confirm-actions">

  <button
    type="button"
    class="btn primary"
    id="confirmAppointmentButton"
  >
    Solicitar turno
  </button>

  <button
    type="button"
    class="btn secondary"
    id="cancelAppointmentSelection"
  >
    Cambiar horario
  </button>

              </div>

              <div
                id="bookingStatus"
                class="agenda-status"
              ></div>

            `
            : `

              <div class="access-box">

                <div
                  style="
                    font-weight:700;
                    margin-bottom:6px;
                  "
                >
                  🔐 Iniciá sesión para reservar
                </div>

                <p
                  class="small"
                  style="margin:0 0 12px;"
                >
                  Necesitás una cuenta de paciente
                  para confirmar este turno.
                </p>

                <div
                  style="
                    display:flex;
                    gap:10px;
                    flex-wrap:wrap;
                  "
                >

                  <a
                    href="login.html"
                    class="btn primary"
                  >
                    Iniciar sesión
                  </a>

                  <a
                    href="registro-paciente.html"
                    class="btn secondary"
                  >
                    Crear cuenta
                  </a>

                </div>

              </div>

            `
        }

      </div>

    `;

    const confirmButton =
      document.getElementById(
        'confirmAppointmentButton'
      );

    const cancelButton =
      document.getElementById(
        'cancelAppointmentSelection'
      );

    if (confirmButton) {

      confirmButton.addEventListener(
        'click',
        bookSelectedAppointment
      );

    }

    if (cancelButton) {

      cancelButton.addEventListener(
        'click',
        function () {

          selectedSlot =
            null;

          confirmArea.style.display =
            'none';

          confirmArea.innerHTML =
            '';

          document
            .querySelectorAll(
              '.agenda-slot'
            )
            .forEach(
              slotButton =>
                slotButton.classList.remove(

  }


  /* =======================================================
     RESERVAR TURNO
     ======================================================= */

  async function bookSelectedAppointment() {

    if (!selectedSlot) {
      return;
    }

    const button =
      document.getElementById(
        'confirmAppointmentButton'
      );

    const status =
      document.getElementById(
        'bookingStatus'

      button.textContent =

    if (status) {

        '';

      status.style.color =
        '';

    try {

      const {
        data: {
          user: currentUser
        }

        await sb.auth.getUser();

      if (!currentUser) {

        throw new Error(
          'Tu sesión expiró. Iniciá sesión nuevamente.'
        );

      }

      const {
        data: appointmentId,
        error
      } =
        await sb.rpc(
          'book_appointment',
          {

            target_professional_id:
              professionalId,

            target_date:
              selectedSlot.date,

            target_start_time:
              selectedSlot.startTime,

            target_modality:
              selectedSlot.modality

          }
        );

      if (error) {

        console.error(
          'Error reservando turno:',
          error
        );

        throw error;

      }

      if (!appointmentId) {

        throw new Error(
          'No se pudo confirmar el turno.'
        );

      }

      confirmArea.style.display =
        'block';

      confirmArea.innerHTML = `

        <div class="agenda-confirm agenda-confirm-success">

          <div class="agenda-success-icon">
            ✓
          </div>

          <div class="agenda-confirm-title">
            Turno reservado
          </div>

          <p class="agenda-confirm-details">

            Tu turno con

            <strong>
              ${escapeHTML(
                professional.display_name ||
                'este profesional'
              )}
            </strong>

            quedó reservado para:

          </p>

          <div class="agenda-success-details">

            <strong>
              ${escapeHTML(
                formatSpanishDate(
                  selectedSlot.date
                )
              )}
            </strong>

            <span>

              ${escapeHTML(
                formatTime(
                  selectedSlot.startTime
                )
              )}

              –

              ${escapeHTML(
                formatTime(
                  selectedSlot.endTime
                )
              )}

              ·

              ${escapeHTML(
                selectedSlot.modality === 'presencial'
                  ? 'Presencial'
                  : 'Virtual'
              )}

            </span>

          </div>

          <div class="agenda-message">

            El turno fue registrado correctamente
            en PsiCerca.

          </div>

        </div>

      `;

      selectedSlot =
        null;

    } catch (error) {

      console.error(
        'Error reservando turno:',
        error
      );

      if (status) {

        status.textContent =
          error.message ||
          'No se pudo reservar el turno.';

        status.style.color =
          '#b42318';

      }

      if (button) {

        button.disabled =
          false;

        button.textContent =
          'Confirmar turno';

      }

    }

  }


  /* =======================================================
     EVENTOS DEL CALENDARIO
     ======================================================= */

  previousMonthButton.addEventListener(
    'click',
    function () {

      const minimumMonth =
        new Date(
          today.getFullYear(),
          today.getMonth(),
          1
        );

      const previousMonth =
        new Date(
          currentMonth.getFullYear(),
          currentMonth.getMonth() - 1,
          1
        );

      if (
        previousMonth <
        minimumMonth
      ) {

        return;

      }

      currentMonth =
        previousMonth;

      renderCalendar();

    }
  );


  nextMonthButton.addEventListener(
    'click',
    function () {

      currentMonth =
        new Date(
          currentMonth.getFullYear(),
          currentMonth.getMonth() + 1,
          1
        );

      renderCalendar();

    }
  );


  renderCalendar();

  await loadSlots();

}


/* =========================================================
   UTILIDADES
   ========================================================= */

function formatDateInput(date) {

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    );

  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    );

  return `${year}-${month}-${day}`;

}


function formatTime(time) {

  if (
    time === null ||
    time === undefined ||
    time === ''
  ) {

    return '';

  }

  const value =
    String(time).trim();

  const matchSeconds =
    value.match(
      /^(\d{2}):(\d{2}):(\d{2})/
    );

  if (matchSeconds) {

    return `${matchSeconds[1]}:${matchSeconds[2]}`;

  }

  const matchMinutes =
    value.match(
      /^(\d{2}):(\d{2})/
    );

  if (matchMinutes) {

    return `${matchMinutes[1]}:${matchMinutes[2]}`;

  }

  return value;

}


function formatSpanishDate(dateString) {

  if (!dateString) {
    return '';
  }

  const parts =
    dateString.split('-');

  if (parts.length !== 3) {
    return dateString;
  }

  const date =
    new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );

  return date.toLocaleDateString(
    'es-AR',
    {
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    }
  );

}
