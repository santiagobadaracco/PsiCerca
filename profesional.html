<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Perfil profesional — PsiCerca</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>

  <style>

    /* =====================================================
       PERFIL PROFESIONAL
       ===================================================== */

    .profile-header {
      display:flex;
      align-items:center;
      gap:20px;
      margin-bottom:30px;
    }

    .profile-avatar {
      width:88px;
      height:88px;
      min-width:88px;
      border-radius:50%;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--soft);
      font-weight:800;
      font-size:24px;
    }

    .profile-avatar img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }


    /* =====================================================
       CONSULTA
       ===================================================== */

    .inquiry-card {
      margin-top:34px;
      padding:26px;
      border:1px solid var(--line);
      border-radius:20px;
      background:#fff;
      box-shadow:0 8px 28px rgba(0,0,0,.045);
    }

    .inquiry-header {
      display:flex;
      align-items:flex-start;
      gap:14px;
      margin-bottom:24px;
    }

    .inquiry-icon {
      width:46px;
      height:46px;
      min-width:46px;
      border-radius:14px;
      background:var(--soft);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
    }

    .inquiry-title {
      margin:2px 0 5px;
      font-size:25px;
      line-height:1.15;
    }

    .inquiry-subtitle {
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.55;
    }

    .inquiry-fields {
      display:grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap:16px;
    }

    .inquiry-field {
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .inquiry-field.full {
      grid-column:1 / -1;
    }

    .inquiry-label {
      font-size:13px;
      font-weight:700;
    }

    .inquiry-field input,
    .inquiry-field select,
    .inquiry-field textarea {
      width:100%;
      box-sizing:border-box;
    }

    .inquiry-hint {
      font-size:11px;
      color:var(--muted);
      line-height:1.4;
    }

    .inquiry-textarea-wrap {
      position:relative;
    }

    .inquiry-textarea-wrap textarea {
      padding-bottom:34px;
      resize:vertical;
      min-height:150px;
    }

    .character-counter {
      position:absolute;
      right:12px;
      bottom:10px;
      font-size:12px;
      color:var(--muted);
      pointer-events:none;
    }

    .privacy-box {
      display:flex;
      gap:12px;
      align-items:flex-start;
      margin-top:18px;
      padding:14px 16px;
      border-radius:14px;
      background:var(--soft);
    }

    .privacy-icon {
      font-size:17px;
      line-height:1.3;
    }

    .privacy-text {
      margin:0;
      font-size:12px;
      line-height:1.55;
      color:var(--muted);
    }

    .inquiry-actions {
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
      margin-top:20px;
    }

    .inquiry-submit {
      min-width:160px;
      justify-content:center;
    }

    .inquiry-submit:disabled {
      opacity:.65;
      cursor:not-allowed;
    }

    .inquiry-status {
      font-size:13px;
      font-weight:600;
    }


    /* =====================================================
       CONTACTO
       ===================================================== */

    .contact-note {
      margin-top:16px;
      padding:14px 16px;
      border-radius:14px;
      background:var(--soft);
      font-size:12px;
      line-height:1.55;
      color:var(--muted);
    }


    /* =====================================================
       WHATSAPP
       ===================================================== */

    .whatsapp-area {
      margin-top:8px;
      padding-top:24px;
      border-top:1px solid var(--line);
    }

    .whatsapp-box {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:18px;
      border-radius:16px;
      background:var(--soft);
    }

    .whatsapp-title {
      font-weight:700;
      margin-bottom:4px;
    }

    .whatsapp-description {
      margin:0;
    }


    /* =====================================================
       MENSAJES
       ===================================================== */

    .access-box {
      background:var(--soft);
      border-radius:16px;
      padding:18px;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width:650px) {

      .profile-header {
        align-items:flex-start;
        gap:14px;
      }

      .profile-avatar {
        width:70px;
        height:70px;
        min-width:70px;
        font-size:20px;
      }

      .inquiry-card {
        padding:20px;
        border-radius:18px;
      }

      .inquiry-fields {
        grid-template-columns:1fr;
      }

      .inquiry-field.full {
        grid-column:auto;
      }

      .inquiry-actions {
        align-items:stretch;
        flex-direction:column;
      }

      .inquiry-submit {
        width:100%;
      }

      .whatsapp-box {
        align-items:stretch;
        flex-direction:column;
      }

      .whatsapp-box .btn {
        width:100%;
        justify-content:center;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="container nav">

    <a
      class="logo"
      href="index.html"
    >
      Psi<span>Cerca</span>
    </a>


    <a
      href="profesionales.html"
      class="btn secondary"
    >
      ← Volver al directorio
    </a>

  </div>

</header>


<main
  class="form-wrap"
  style="max-width:760px"
>

  <div
    id="profile"
    class="panel"
  >

    <div class="empty">
      Cargando perfil…
    </div>

  </div>

</main>


<footer class="footer">

  <div class="container">

    PsiCerca · Plataforma tecnológica · 2026

  </div>

</footer>


<script>

(async function () {

  const box =
    document.getElementById('profile');


  const id =
    new URLSearchParams(
      window.location.search
    ).get('id');


  if (!id) {

    box.innerHTML = `
      <div class="empty">
        Perfil no encontrado.
      </div>
    `;

    return;

  }


  try {

    const sb =
      requireSupabase();


    /*
     * =====================================================
     * PERFIL PÚBLICO
     * =====================================================
     */

    const {
      data: p,
      error
    } = await sb

      .from('profiles')

      .select(`
        id,
        display_name,
        license,
        jurisdiction,
        zone,
        modality,
        orientation,
        population,
        bio,
        photo_url
      `)

      .eq('id', id)

      .eq('is_public', true)

      .single();


    if (error) {
      throw error;
    }


    if (!p) {

      throw new Error(
        'Perfil no encontrado'
      );

    }


    /*
     * =====================================================
     * INICIALES
     * =====================================================
     */

    const initials =
      (p.display_name || 'PS')

        .split(' ')

        .filter(Boolean)

        .map(x => x[0])

        .join('')

        .slice(0, 2)

        .toUpperCase();


    /*
     * =====================================================
     * FOTO / AVATAR
     * =====================================================
     */

    const avatar =

      p.photo_url

        ? `

          <div class="profile-avatar">

            <img
              src="${escapeHTML(p.photo_url)}"
              alt="Foto de ${escapeHTML(
                p.display_name || 'profesional'
              )}"
            >

          </div>

        `

        : `

          <div class="profile-avatar">

            ${escapeHTML(initials)}

          </div>

        `;


    /*
     * =====================================================
     * CHIPS
     * =====================================================
     */

    const chips = [

      p.orientation,
      p.population,
      p.modality,
      p.zone

    ]

      .filter(Boolean)

      .map(x => `

        <span class="chip">
          ${escapeHTML(x)}
        </span>

      `)

      .join('');


    /*
     * =====================================================
     * RENDER DEL PERFIL
     * =====================================================
     */

    box.innerHTML = `

      <!-- ENCABEZADO -->

      <div class="profile-header">

        ${avatar}


        <div style="min-width:0;">

          <span class="eyebrow">
            Perfil profesional
          </span>


          <h1
            style="
              margin:4px 0 8px;
              font-size:clamp(32px,5vw,48px);
            "
          >

            ${escapeHTML(
              p.display_name || 'Profesional'
            )}

          </h1>


          <div class="small">

            Matrícula:

            <strong>
              ${escapeHTML(
                p.license || '—'
              )}
            </strong>

            ·

            ${escapeHTML(
              p.jurisdiction || '—'
            )}

          </div>

        </div>

      </div>


      <!-- VERIFICACIÓN EXTERNA -->

      ${
        p.license

          ? `

            <div
              style="
                background:var(--soft);
                border-radius:16px;
                padding:16px 18px;
                margin-bottom:28px;
              "
            >

              <div
                style="
                  font-weight:700;
                  margin-bottom:5px;
                "
              >

                🔎 ¿Querés comprobar la matrícula?

              </div>


              <p
                class="small"
                style="
                  margin:0 0 12px;
                "
              >

                Podés consultar esta matrícula
                directamente en el registro oficial
                del Ministerio de Salud.

              </p>


              <a
                href="https://www.argentina.gob.ar/salud/buscador-nacional-de-profesionales-de-la-salud"
                target="_blank"
                rel="noopener noreferrer"
                class="btn secondary"
                style="font-size:13px;"
              >

                Consultar matrícula en registro oficial

              </a>

            </div>

          `

          : ''

      }


      <!-- INFORMACIÓN PROFESIONAL -->

      ${
        chips

          ? `

            <div
              class="chips"
              style="
                margin:0 0 32px;
              "
            >

              ${chips}

            </div>

          `

          : ''

      }


      <!-- PRESENTACIÓN -->

      <section>

        <h2>
          Sobre mi práctica
        </h2>


        <p
          style="
            white-space:pre-line;
            margin-bottom:28px;
          "
        >

          ${
            escapeHTML(
              p.bio ||
              'El profesional todavía no agregó una presentación.'
            )
          }

        </p>

      </section>


      <!-- CONTACTO -->

      <div
        id="contactArea"
        class="whatsapp-area"
      >

        <div class="small">
          Verificando acceso al contacto…
        </div>

      </div>


      <!-- CONSULTA -->

      <div id="inquiryArea"></div>


      <!-- ACLARACIONES -->

      <div
        style="
          margin-top:32px;
          padding-top:20px;
          border-top:1px solid var(--line);
        "
      >

        <p
          class="small"
          style="margin:0 0 10px;"
        >

          La información de matrícula es declarada
          por el profesional. PsiCerca recomienda
          verificarla en el

          <a
            href="https://www.argentina.gob.ar/salud/buscador-nacional-de-profesionales-de-la-salud"
            target="_blank"
            rel="noopener noreferrer"
            style="
              color:var(--accent);
              font-weight:700;
            "
          >

            registro oficial del Ministerio de Salud

          </a>.

        </p>


        <p
          class="small"
          style="margin:0;"
        >

          PsiCerca facilita el contacto y no determina
          qué profesional es clínicamente adecuado
          para una persona.

        </p>

      </div>

    `;


    /*
     * =====================================================
     * ELEMENTOS
     * =====================================================
     */

    const contactArea =
      document.getElementById(
        'contactArea'
      );


    const inquiryArea =
      document.getElementById(
        'inquiryArea'
      );


    /*
     * =====================================================
     * USUARIO ACTUAL
     * =====================================================
     */

    const {
      data: {
        user
      }
    } =
      await sb.auth.getUser();


    /*
     * =====================================================
     * SIN SESIÓN
     * =====================================================
     */

    if (!user) {

      contactArea.innerHTML = `

        <div class="access-box">

          <div
            style="
              font-weight:700;
              margin-bottom:6px;
            "
          >

            🔐 ¿Querés contactar a este profesional?

          </div>


          <p
            class="small"
            style="
              margin:0 0 15px;
            "
          >

            Creá una cuenta gratuita para
            poder contactar a profesionales
            a través de PsiCerca.

          </p>


          <div
            style="
              display:flex;
              gap:10px;
              flex-wrap:wrap;
            "
          >

            <a
              href="registro-paciente.html"
              class="btn primary"
            >

              Crear cuenta

            </a>


            <a
              href="login.html"
              class="btn secondary"
            >

              Iniciar sesión

            </a>

          </div>

        </div>

      `;


      inquiryArea.innerHTML = `

        <div
          class="inquiry-card"
          style="
            background:var(--soft);
            box-shadow:none;
          "
        >

          <div class="inquiry-header">

            <div class="inquiry-icon">
              💬
            </div>

            <div>

              <span class="eyebrow">
                Contacto
              </span>

              <h2 class="inquiry-title">
                Enviar consulta
              </h2>

              <p class="inquiry-subtitle">
                Iniciá sesión o creá una cuenta de paciente
                para enviar una consulta.
              </p>

            </div>

          </div>

        </div>

      `;

      return;

    }


    /*
     * =====================================================
     * ROL
     * =====================================================
     */

    const role =
      user.user_metadata?.role;


    /*
     * =====================================================
     * PACIENTE
     * =====================================================
     */

    if (role === 'patient') {


      /*
       * ---------------------------------------------------
       * WHATSAPP DEL PROFESIONAL
       * ---------------------------------------------------
       */

      const {
        data: contacts,
        error: contactError
      } = await sb.rpc(
        'get_professional_contact',
        {
          target_profile_id: id
        }
      );


      if (
        contactError ||
        !contacts ||
        !contacts.length ||
        !contacts[0].whatsapp
      ) {

        contactArea.innerHTML = `

          <div class="access-box">

            <div class="small">

              Este profesional todavía no
              agregó un medio de contacto.

            </div>

          </div>

        `;

      } else {

        const whatsapp =
          String(
            contacts[0].whatsapp
          ).replace(/\D/g, '');


        if (whatsapp) {

          contactArea.innerHTML = `

            <div class="whatsapp-box">

              <div>

                <div class="whatsapp-title">
                  ¿Preferís un contacto directo?
                </div>

                <p class="small whatsapp-description">
                  También podés comunicarte con este
                  profesional por WhatsApp.
                </p>

              </div>


              <a
                class="btn primary"
                target="_blank"
                rel="noopener noreferrer"
                href="https://wa.me/${escapeHTML(whatsapp)}"
              >

                Contactar por WhatsApp

              </a>

            </div>

          `;

        }

      }


      /*
       * ---------------------------------------------------
       * FORMULARIO DE CONSULTA
       * ---------------------------------------------------
       */

      inquiryArea.innerHTML = `

        <section class="inquiry-card">

          <div class="inquiry-header">

            <div class="inquiry-icon">
              💬
            </div>


            <div>

              <span class="eyebrow">
                Contacto
              </span>


              <h2 class="inquiry-title">
                Enviar consulta
              </h2>


              <p class="inquiry-subtitle">

                Completá tus datos y contale brevemente
                a este profesional qué estás buscando.
                Luego podrá contactarte directamente.

              </p>

            </div>

          </div>


          <form id="inquiryForm">


            <div class="inquiry-fields">


              <!-- NOMBRE -->

              <label class="inquiry-field">

                <span class="inquiry-label">
                  Nombre y apellido *
                </span>

                <input
                  id="inquiryName"
                  type="text"
                  required
                  maxlength="100"
                  placeholder="Tu nombre y apellido"
                >

              </label>


              <!-- EDAD -->

              <label class="inquiry-field">

                <span class="inquiry-label">
                  Edad
                </span>

                <input
                  id="inquiryAge"
                  type="number"
                  min="1"
                  max="120"
                  placeholder="Edad"
                >

              </label>


              <!-- WHATSAPP -->

              <label class="inquiry-field">

                <span class="inquiry-label">
                  WhatsApp *
                </span>

                <input
                  id="inquiryWhatsapp"
                  type="tel"
                  required
                  maxlength="30"
                  placeholder="Ej.: 11 1234-5678"
                >

                <span class="inquiry-hint">
                  El profesional utilizará este número
                  para contactarte.

                </span>

              </label>


              <!-- EMAIL -->

              <label class="inquiry-field">

                <span class="inquiry-label">
                  Email
                </span>

                <input
                  id="inquiryEmail"
                  type="email"
                  maxlength="150"
                  placeholder="tuemail@ejemplo.com"
                >

                <span class="inquiry-hint">
                  Opcional. Podés dejarlo como medio
                  de contacto alternativo.

                </span>

              </label>


              <!-- MODALIDAD -->

              <label class="inquiry-field">

                <span class="inquiry-label">
                  Modalidad
                </span>

                <select id="inquiryModality">

                  <option value="">
                    Seleccionar
                  </option>

                  <option value="Presencial">
                    Presencial
                  </option>

                  <option value="Virtual">
                    Virtual
                  </option>

                  <option value="Indistinta">
                    Indistinta
                  </option>

                </select>

              </label>


              <!-- ZONA -->

              <label class="inquiry-field">

                <span class="inquiry-label">
                  Zona
                </span>

                <input
                  id="inquiryZone"
                  type="text"
                  maxlength="100"
                  placeholder="Ej.: Avellaneda"
                >

              </label>


              <!-- DISPONIBILIDAD -->

              <label class="inquiry-field full">

                <span class="inquiry-label">
                  Disponibilidad
                </span>

                <input
                  id="inquiryAvailability"
                  type="text"
                  maxlength="150"
                  placeholder="Ej.: lunes y miércoles por la tarde"
                >

              </label>


              <!-- MOTIVO -->

              <label class="inquiry-field full">

                <span class="inquiry-label">
                  Motivo general
                </span>

                <select id="inquiryReason">

                  <option value="">
                    Seleccionar
                  </option>

                  <option value="Inicio de proceso">
                    Inicio de proceso
                  </option>

                  <option value="Orientación">
                    Orientación
                  </option>

                  <option value="Consulta personal">
                    Consulta personal
                  </option>

                  <option value="Consulta de pareja">
                    Consulta de pareja
                  </option>

                  <option value="Consulta familiar">
                    Consulta familiar
                  </option>

                  <option value="Otro">
                    Otro
                  </option>

                </select>

              </label>


              <!-- MENSAJE -->

              <label class="inquiry-field full">

                <span class="inquiry-label">
                  Mensaje *
                </span>


                <div class="inquiry-textarea-wrap">

                  <textarea
                    id="inquiryMessage"
                    required
                    maxlength="1000"
                    rows="6"
                    placeholder="Contale brevemente qué estás buscando y qué necesitás."
                  ></textarea>


                  <span
                    id="characterCounter"
                    class="character-counter"
                  >
                    0 / 1000
                  </span>

                </div>

              </label>


            </div>


            <!-- PRIVACIDAD -->

            <div class="privacy-box">

              <div class="privacy-icon">
                🔒
              </div>


              <p class="privacy-text">

                Por privacidad, evitá incluir diagnósticos,
                antecedentes clínicos detallados, medicación
                o historias clínicas. Este formulario está
                pensado únicamente para un primer contacto.

              </p>

            </div>


            <div class="contact-note">

              <strong>¿Qué pasa después?</strong><br>

              Tu consulta será recibida por el profesional.
              Si considera que puede responder a tu búsqueda,
              podrá contactarte directamente mediante el
              WhatsApp o email que indiques.

            </div>


            <!-- ACCIONES -->

            <div class="inquiry-actions">

              <button
                type="submit"
                class="btn primary inquiry-submit"
                id="sendInquiryButton"
              >

                Enviar consulta

              </button>


              <span
                id="inquiryMessageStatus"
                class="inquiry-status"
              ></span>

            </div>


          </form>

        </section>

      `;


      /*
       * ---------------------------------------------------
       * ELEMENTOS DEL FORMULARIO
       * ---------------------------------------------------
       */

      const inquiryForm =
        document.getElementById(
          'inquiryForm'
        );


      const sendButton =
        document.getElementById(
          'sendInquiryButton'
        );


      const inquiryStatus =
        document.getElementById(
          'inquiryMessageStatus'
        );


      const messageField =
        document.getElementById(
          'inquiryMessage'
        );


      const characterCounter =
        document.getElementById(
          'characterCounter'
        );


      /*
       * ---------------------------------------------------
       * CONTADOR
       * ---------------------------------------------------
       */

      function updateCharacterCounter() {

        const length =
          messageField.value.length;


        characterCounter.textContent =
          `${length} / 1000`;

      }


      messageField.addEventListener(
        'input',
        updateCharacterCounter
      );


      /*
       * ---------------------------------------------------
       * ENVÍO DE CONSULTA
       * ---------------------------------------------------
       */

      inquiryForm.addEventListener(
        'submit',
        async function (event) {

          event.preventDefault();


          sendButton.disabled = true;

          sendButton.textContent =
            'Enviando…';

          inquiryStatus.textContent =
            '';

          inquiryStatus.style.color =
            '';


          try {

            /*
             * Verificamos nuevamente
             * que siga existiendo la sesión.
             */

            const {
              data: {
                user: currentUser
              }
            } =
              await sb.auth.getUser();


            if (!currentUser) {

              throw new Error(
                'Tu sesión expiró. Iniciá sesión nuevamente.'
              );

            }


            /*
             * DATOS
             */

            const patientName =
              document.getElementById(
                'inquiryName'
              ).value.trim();


            const ageValue =
              document.getElementById(
                'inquiryAge'
              ).value;


            const patientAge =
              ageValue
                ? Number(ageValue)
                : null;


            const patientWhatsapp =
              document.getElementById(
                'inquiryWhatsapp'
              ).value.trim();


            const patientEmail =
              document.getElementById(
                'inquiryEmail'
              ).value.trim();


            const modality =
              document.getElementById(
                'inquiryModality'
              ).value;


            const availability =
              document.getElementById(
                'inquiryAvailability'
              ).value.trim();


            const zone =
              document.getElementById(
                'inquiryZone'
              ).value.trim();


            const reason =
              document.getElementById(
                'inquiryReason'
              ).value;


            const message =
              document.getElementById(
                'inquiryMessage'
              ).value.trim();


            /*
             * VALIDACIONES
             */

            if (!patientName) {

              throw new Error(
                'Ingresá tu nombre y apellido.'
              );

            }


            if (!patientWhatsapp) {

              throw new Error(
                'Ingresá un número de WhatsApp para que el profesional pueda contactarte.'
              );

            }


            if (
              patientWhatsapp.replace(/\D/g, '').length < 8
            ) {

              throw new Error(
                'Ingresá un número de WhatsApp válido.'
              );

            }


            if (
              patientEmail &&
              !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
                patientEmail
              )
            ) {

              throw new Error(
                'Ingresá un email válido o dejá el campo vacío.'
              );

            }


            if (!message) {

              throw new Error(
                'Escribí un mensaje antes de enviar la consulta.'
              );

            }


            /*
             * INSERT
             */

            const {
              error: insertError
            } = await sb

              .from('professional_inquiries')

              .insert({

                professional_id: id,

                patient_id: currentUser.id,

                patient_name: patientName,

                patient_age: patientAge,

                patient_whatsapp:
                  patientWhatsapp,

                patient_email:
                  patientEmail || null,

                modality:
                  modality || null,

                availability:
                  availability || null,

                zone:
                  zone || null,

                reason:
                  reason || null,

                message

              });


            if (insertError) {

              console.error(
                'Error creando consulta:',
                insertError
              );

              throw insertError;

            }


            /*
             * ÉXITO
             */

            inquiryForm.reset();

            updateCharacterCounter();


            sendButton.textContent =
              'Consulta enviada ✓';


            sendButton.disabled =
              true;


            inquiryStatus.textContent =
              'La consulta fue enviada correctamente.';


            inquiryStatus.style.color =
              'var(--accent)';


          } catch (error) {

            console.error(
              'Error enviando consulta:',
              error
            );


            inquiryStatus.textContent =
              error.message ||
              'No se pudo enviar la consulta.';


            inquiryStatus.style.color =
              '#b42318';


            sendButton.disabled =
              false;


            sendButton.textContent =
              'Enviar consulta';

          }

        }
      );


      return;

    }


    /*
     * =====================================================
     * PROFESIONAL
     * =====================================================
     */

    contactArea.innerHTML = `

      <div class="access-box">

        <div class="small">

          Iniciaste sesión como profesional.
          Para contactar a este profesional
          necesitás utilizar una cuenta de paciente.

        </div>

      </div>

    `;


    inquiryArea.innerHTML = `

      <div
        class="inquiry-card"
        style="
          background:var(--soft);
          box-shadow:none;
        "
      >

        <div class="inquiry-header">

          <div class="inquiry-icon">
            💬
          </div>


          <div>

            <span class="eyebrow">
              Contacto
            </span>


            <h2 class="inquiry-title">
              Enviar consulta
            </h2>


            <p class="inquiry-subtitle">

              Las consultas desde PsiCerca están
              disponibles para cuentas de paciente.

            </p>

          </div>

        </div>

      </div>

    `;


  } catch (error) {

    console.error(
      'Error cargando perfil:',
      error
    );


    box.innerHTML = `

      <div class="empty">

        Este perfil no está disponible
        o no es público.

      </div>

    `;

  }


})();

</script>


</body>

</html>
