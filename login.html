<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión — PsiCerca</title><link rel="stylesheet" href="css/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script></head><body><header><div class="container nav"><a class="logo" href="index.html">Psi<span>Cerca</span></a><a href="registro.html" class="btn secondary">Crear cuenta</a></div></header><main class="form-wrap"><div class="form-card"><span class="eyebrow">Área profesional</span><h1>Iniciar sesión</h1><p class="small">Accedé a tu panel de PsiCerca.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn primary full" type="submit">Ingresar</button><div id="msg" class="message"></div></form><p class="small">¿Todavía no tenés cuenta? <a href="registro.html" style="color:var(--accent);font-weight:700">Registrate</a></p></div></main><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='Ingresando…';try{const sb=requireSupabase();const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)throw error;location.href='dashboard.html'}catch(err){showMessage('msg',err.message||'No se pudo iniciar sesión.',true)}finally{b.disabled=false;b.textContent='Ingresar'}})</script></body></html>
