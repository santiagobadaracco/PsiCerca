<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Profesionales — PsiCerca</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
</head>

<body>

  <header>
    <div class="container nav">

      <a class="logo" href="index.html">
        Psi<span>Cerca</span>
      </a>

      <nav class="navlinks">
        <a href="index.html">Inicio</a>
        <a href="login.html">Área profesional</a>
      </nav>

    </div>
  </header>

  <main class="directory">

    <div class="container">

      <span class="eyebrow">Directorio</span>

      <h1>Encontrá un profesional</h1>

      <p class="small">
        Explorá los perfiles públicos disponibles.
      </p>

      <div class="filters">

        <input
          id="q"
          placeholder="Nombre u orientación"
        >

        <input
          id="zone"
          placeholder="Zona / localidad"
        >

        <select id="modality">

          <option value="">
            Cualquier modalidad
          </option>

          <option>
            Presencial y online
          </option>

          <option>
            Solo online
          </option>

          <option>
            Solo presencial
          </option>

        </select>

        <button
          class="btn primary"
          onclick="loadProfiles()"
        >
          Buscar
        </button>

      </div>

      <div
        id="results"
        class="results"
      >
        <div class="empty">
          Cargando perfiles…
        </div>
      </div>

    </div>

  </main>

  <footer class="footer">

    <div class="container">
      PsiCerca · Plataforma tecnológica · 2026
    </div>

  </footer>

  <script src="directorio.js"></script>

</body>
</html>
